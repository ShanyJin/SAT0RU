            white-space: pre;

<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- Scene & Rendering ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 55;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.domElement.style.position = 'fixed';
    renderer.domElement.style.top = '0';
    renderer.domElement.style.left = '0';
    renderer.domElement.style.zIndex = '1';
    renderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(renderer.domElement);
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    composer.addPass(bloomPass);

    const COUNT = 20000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const sizes = new Float32Array(COUNT);
    
    const targetPositions = new Float32Array(COUNT * 3);
    const targetColors = new Float32Array(COUNT * 3);
    const targetSizes = new Float32Array(COUNT);
    const purpleExplosionSourcePositions = new Float32Array(COUNT * 3);
    const purpleExplosionSourceSizes = new Float32Array(COUNT);

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const particleMaterial = new THREE.PointsMaterial({
        size: 0.3,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
    });

    const particles = new THREE.Points(geometry, particleMaterial);
    scene.add(particles);

    // Technique Functions 
    function getRed(i) {
        if(i < COUNT * 0.1) {
            const r = Math.random() * 9;
            const theta = Math.random() * 6.28; const phi = Math.acos(2 * Math.random() - 1);
            return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 3, g: 0.1, b: 0.1, s: 2.5 };
        } else {
            const armCount = 3; const t = (i / COUNT); 
            const angle = t * 15 + ((i % armCount) * (Math.PI * 2 / armCount));
            const radius = 2 + (t * 40); 
            return { x: radius * Math.cos(angle), y: radius * Math.sin(angle), z: (Math.random() - 0.5) * (10 * t), r: 0.8, g: 0, b: 0, s: 1.0 };
        }
    }

    function getVoid(i) {
        if (i < COUNT * 0.15) {
            const angle = Math.random() * Math.PI * 2;
            return { x: 26 * Math.cos(angle), y: 26 * Math.sin(angle), z: (Math.random()-0.5) * 1, r: 1, g: 1, b: 1, s: 2.5 };
        } else {
            const radius = 30 + Math.random() * 90;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            return { x: radius * Math.sin(phi) * Math.cos(theta), y: radius * Math.sin(phi) * Math.sin(theta), z: radius * Math.cos(phi), r: 0.1, g: 0.6, b: 1.0, s: 0.7 };
        }
    }

    function getPurple(i) {
        if (Math.random() > 0.8) return { x: (Math.random() - 0.5) * 100, y: (Math.random() - 0.5) * 100, z: (Math.random() - 0.5) * 100, r: 0.5, g: 0.5, b: 0.7, s: 0.8 };
        const r = 20; const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1);
        return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 0.6, g: 0.5, b: 1.0, s: 2.5 };
    }

    function getShrine(i) {
        const total = COUNT;
        if (i < total * 0.3) return { x: (Math.random()-0.5)*80, y: -15, z: (Math.random()-0.5)*80, r: 0.4, g: 0, b: 0, s: 0.8 };
        else if (i < total * 0.4) {
            const px = ((i%4)<2?1:-1)*12; const pz = ((i%4)%2==0?1:-1)*8;
            return { x: px+(Math.random()-0.5)*2, y: -15+Math.random()*30, z: pz+(Math.random()-0.5)*2, r: 0.2, g: 0.2, b: 0.2, s: 0.6 };
        } else if (i < total * 0.6) {
            const t = Math.random() * Math.PI * 2; const rad = Math.random() * 30;
            const curve = Math.pow(rad/30, 2) * 10; 
            return { x: rad*Math.cos(t), y: 15 - curve + (Math.random()*2), z: rad*Math.sin(t)*0.6, r: 0.6, g: 0, b: 0, s: 0.6 };
        } else return { x: 0, y: 0, z: 0, r: 0, g: 0, b: 0, s: 0 };
    }

    // --- Techniques ported from community PRs (#2, #3, #9, #13) ---
    function getBlue(i) {
        const r = 15 + Math.random() * 30;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 0.1, g: 0.3, b: 1.0, s: 2.0 };
    }

    function getBlackFlash(i) {
        if (i < COUNT * 0.2) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 5 + Math.random() * 15;
            return { x: radius * Math.cos(angle), y: radius * Math.sin(angle), z: (Math.random() - 0.5) * 20, r: 0.0, g: 0.0, b: 0.0, s: 3.0 };
        } else {
            return { x: (Math.random() - 0.5) * 100, y: (Math.random() - 0.5) * 100, z: (Math.random() - 0.5) * 100, r: 0.1, g: 0.1, b: 0.1, s: 0.5 };
        }
    }

    function getShadowGarden(i) {
        const x = (Math.random() - 0.5) * 80;
        const z = (Math.random() - 0.5) * 80;
        const y = Math.random() > 0.9 ? (Math.random() * 40 - 20) : -25;
        return { x: x, y: y, z: z, r: 0.05, g: 0.05, b: 0.1, s: 1.5 };
    }

    function getTransfiguration(i) {
        const t = (i / COUNT) * Math.PI * 12;
        const r = 8 + Math.sin(t * 0.5) * 4;
        return { x: r * Math.cos(t), y: (i / COUNT) * 60 - 30, z: r * Math.sin(t), r: 0.9, g: 0.6, b: 0.7, s: 2.0 };
    }

    function getRatio(i) {
        const isMajorLine = i % 10 < 3;
        const x = (i % 20 - 10) * 4;
        const y = (Math.floor(i / 20) % 20 - 10) * 4;
        return { x: x, y: y, z: (Math.random() - 0.5) * 5, r: isMajorLine ? 1.0 : 0.8, g: isMajorLine ? 0.8 : 0.2, b: 0.1, s: isMajorLine ? 2.5 : 0.8 };
    }

    let divineFlag = 0;
    let divineFlag2 = 0;

    // Mahoraga — ported from PR #13 (closed fist remapped to both fists).
    function getDivine(i) {
        if (i < COUNT * 0.1) {
            const angle = Math.random() * Math.PI * 2;
            return { x: 26 * Math.cos(angle), y: 26 * Math.sin(angle), z: (Math.random() - 0.5) * 1, r: 1, g: 0.84, b: 0, s: 2.5 };
        }
        if (i < COUNT * 0.2) {
            const r = Math.random() * 10;
            const theta = Math.random() * 6.28; const phi = Math.acos(2 * Math.random() - 1);
            return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 1, g: 0.84, b: 0, s: 2.5 };
        }
        else if (i < COUNT * 0.3) {
            const y = 35;
            const angle = Math.PI / 3;
            const rotatedX = y * Math.sin(angle);
            const rotatedY = y * Math.cos(angle);
            if (divineFlag == 0) {
                divineFlag = 1;
                return { x: 0, y: 35, z: 0, r: 1, g: 0.84, b: 0, s: 2.5 };
            } else if (divineFlag == 1) {
                divineFlag = 2;
                return { x: rotatedX, y: rotatedY, z: 0, r: 1, g: 0.84, b: 0, s: 2.5 };
            } else if (divineFlag == 2) {
                divineFlag = 3;
                return { x: y * Math.sin(angle * 2), y: y * Math.cos(angle * 2), z: 0, r: 1, g: 0.84, b: 0, s: 2.5 };
            } else if (divineFlag == 3) {
                divineFlag = 4;
                return { x: y * Math.sin(angle * 3), y: y * Math.cos(angle * 3), z: 0, r: 1, g: 0.84, b: 0, s: 2.5 };
            } else if (divineFlag == 4) {
                divineFlag = 5;
                return { x: y * Math.sin(angle * 4), y: y * Math.cos(angle * 4), z: 0, r: 1, g: 0.84, b: 0, s: 2.5 };
            } else if (divineFlag == 5) {
                divineFlag = 0;
                return { x: y * Math.sin(angle * 5), y: y * Math.cos(angle * 5), z: 0, r: 1, g: 0.84, b: 0, s: 2.5 };
            }
        }
        else if (i < COUNT * 0.42) {
            const angle = Math.PI / 3;
            const thickness = 4.2;
            const y = -35 + Math.random() * 70;
            const rotatedX = y * Math.sin(angle);
            const rotatedY = y * Math.cos(angle);
            if (divineFlag2 == 0) {
                divineFlag2 = 1;
                return { x: 0, y: 35, z: 0, r: 1, g: 0.84, b: 0, s: 2.5 };
            } else if (divineFlag2 == 1) {
                divineFlag2 = 2;
                return { x: rotatedX, y: rotatedY, z: (Math.random() - 0.5) * thickness, r: 1, g: 0.84, b: 0, s: 1.5 };
            } else if (divineFlag2 == 2) {
                divineFlag2 = 3;
                return { x: y * Math.sin(angle * 2), y: y * Math.cos(angle * 2), z: (Math.random() - 0.5) * thickness, r: 1, g: 0.84, b: 0, s: 1.5 };
            } else if (divineFlag2 == 3) {
                divineFlag2 = 4;
                return { x: y * Math.sin(angle * 3), y: y * Math.cos(angle * 3), z: (Math.random() - 0.5) * thickness, r: 1, g: 0.84, b: 0, s: 1.5 };
            } else if (divineFlag2 == 4) {
                divineFlag2 = 5;
                return { x: y * Math.sin(angle * 4), y: y * Math.cos(angle * 4), z: (Math.random() - 0.5) * thickness, r: 1, g: 0.84, b: 0, s: 1.5 };
            } else if (divineFlag2 == 5) {
                divineFlag2 = 0;
                return { x: y * Math.sin(angle * 5), y: y * Math.cos(angle * 5), z: (Math.random() - 0.5) * thickness, r: 1, g: 0.84, b: 0, s: 1.5 };
            }
        }
        else {
            const radius = 30 + Math.random() * 90;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            return { x: radius * Math.sin(phi) * Math.cos(theta), y: radius * Math.sin(phi) * Math.sin(theta), z: radius * Math.cos(phi), r: 1, g: 1, b: 1.0, s: 0.7 };
        }
    }

    // Idle Death Gamble — ported from PR #9.
    function getIdleDeathGamble(i) {
        const total = COUNT;
        if (i < total * 0.05) {
            const r = Math.random() * 4;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const heat = Math.random();
            return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 1.0, g: heat * 0.85, b: heat * 0.3, s: 3.5 };
        }
        else if (i < total * 0.15) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 18 + Math.random() * 4;
            return { x: radius * Math.cos(angle), y: radius * Math.sin(angle) + (Math.random() - 0.5) * 2, z: (Math.random() - 0.5) * 2, r: 0.7, g: 0.0, b: 1.0, s: 2.0 };
        }
        else if (i < total * 0.40) {
            const clusterIndex = Math.floor(Math.random() * 6);
            const clusterAngles = [0, 1.05, 2.09, 3.14, 4.19, 5.24];
            const clusterR = 28 + (clusterIndex % 3) * 6;
            const cx = clusterR * Math.cos(clusterAngles[clusterIndex]);
            const cy = clusterR * Math.sin(clusterAngles[clusterIndex]) * 0.5;
            const cz = (clusterIndex % 2 === 0 ? 1 : -1) * 8;
            return { x: cx + (Math.random() - 0.5) * 8, y: cy + (Math.random() - 0.5) * 8, z: cz + (Math.random() - 0.5) * 8, r: 0.45, g: 0.0, b: 0.65, s: 0.9 };
        }
        else if (i < total * 0.60) {
            const t = (i - total * 0.40) / (total * 0.20);
            const armOffset = (i % 3) * (Math.PI * 2 / 3);
            const angle = t * 18 + armOffset;
            const radius = 5 + t * 45;
            return { x: radius * Math.cos(angle), y: radius * Math.sin(angle) + (Math.random() - 0.5) * (6 * t), z: (Math.random() - 0.5) * (12 * t), r: 0.25, g: 0.0, b: 0.35, s: 0.7 };
        }
        else {
            const radius = 55 + Math.random() * 55;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            return { x: radius * Math.sin(phi) * Math.cos(theta), y: radius * Math.sin(phi) * Math.sin(theta), z: radius * Math.cos(phi), r: 0.12, g: 0.0, b: 0.18, s: 0.5 };
        }
    }

    // Authentic Mutual Love — ported from PR #9.
    function getAuthenticMutualLove(i) {
        const total = COUNT;
        if (i < total * 0.15) {
            const t = (i / (total * 0.15));
            const bladeY = -20 + t * 55;
            const thickness = (1 - t) * 1.2 + 0.1;
            const heat = 1 - t * 0.4;
            return { x: (Math.random() - 0.5) * thickness, y: bladeY + (Math.random() - 0.5) * 0.6, z: (Math.random() - 0.5) * thickness, r: heat, g: heat * 0.92, b: heat * 0.6, s: 1.8 - t * 1.0 };
        }
        else if (i < total * 0.19) {
            return { x: (Math.random() - 0.5) * 18, y: -14 + (Math.random() - 0.5) * 0.8, z: (Math.random() - 0.5) * 1.2, r: 1.0, g: 0.82, b: 0.2, s: 1.6 };
        }
        else if (i < total * 0.37) {
            const angle = ((i - total * 0.19) / (total * 0.18)) * Math.PI * 2;
            const ringR = 22, tilt = 0.09;
            return { x: ringR * Math.cos(angle), y: ringR * Math.sin(angle) * tilt + (Math.random() - 0.5) * 0.5, z: ringR * Math.sin(angle), r: 0.05, g: 0.55, b: 1.0, s: 2.2 };
        }
        else if (i < total * 0.49) {
            const angle = Math.random() * Math.PI * 2;
            const ringR = 22 + (Math.random() - 0.5) * 5, tilt = 0.09;
            return { x: ringR * Math.cos(angle), y: ringR * Math.sin(angle) * tilt + (Math.random() - 0.5) * 2, z: ringR * Math.sin(angle), r: 0.3, g: 0.8, b: 1.0, s: 0.7 };
        }
        else {
            const radius = 40 + Math.random() * 55, theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
            const warmth = Math.random();
            return { x: radius * Math.sin(phi) * Math.cos(theta), y: radius * Math.sin(phi) * Math.sin(theta), z: radius * Math.cos(phi), r: 0.9, g: warmth * 0.45, b: warmth * 0.55, s: 0.4 };
        }
    }

    // Deadly Sentencing — ported from PR #9, triggered by voice ("don't move").
    function getDeadlySentencing(i) {
        const total = COUNT;
        const headLen = 16;
        const headR = 5;
        const headCX = 2;
        const headCY = 6;
        const tiltAng = -Math.PI * 0.22;
        const tCos = Math.cos(tiltAng), tSin = Math.sin(tiltAng);
        const tiltHead = (lx, ly) => ({
            x: headCX + lx * tCos - ly * tSin,
            y: headCY + lx * tSin + ly * tCos
        });
        const tiltedBottom = tiltHead(0, -headR);
        const handleStartX = tiltedBottom.x;
        const handleStartY = tiltedBottom.y;
        const handleAng = Math.PI * 1.22;
        const hCos = Math.cos(handleAng);
        const hSin = Math.sin(handleAng);

        if (i < total * 0.20) {
            const lx = (Math.random() - 0.5) * headLen * 2;
            const cAng = Math.random() * Math.PI * 2;
            const ly = Math.cos(cAng) * headR;
            const lz = Math.sin(cAng) * headR;

    // Hand Tracking
    // --- Gesture Tuning Knobs (safe to change) ---
    // Keep tuning changes in this object. Core logic below should stay stable unless you are rewriting detection behavior.
    const TUNING = {
        smoothingAlpha: 0.20, // Higher reacts faster; lower is more stable.
        enterThreshold: 0.75, // Minimum smoothed score to enter a gesture.
        exitThreshold: 0.5, // If current gesture stays above this, it is held.

    // --- Hand Tracking Core (avoid changing unless logic changes are intended) ---
    let currentTech = 'neutral';
    let purpleEnteredAtMs = -Infinity;

    const FLICK = {

        maxDisplacement: 0.13,

    const videoElement = document.querySelector('.input_video');

    let glowColor = '#00ffff';
    // Score-driven gestures. Order matters: earlier entries win exact ties.
    const SCORE_GESTURES = [

        'shrine', 'void', 'red', 'blue', 'blackflash', 'love', 'perfection', 'ratio', 'flick'

    const GESTURES = ['neutral', ...SCORE_GESTURES, ...VOICE_GESTURES];

    const rawScores = Object.fromEntries(GESTURES.map((tech) => [tech, tech === 'neutral' ? 1 : 0]));

    function clamp01(v) {
        return Math.min(1, Math.max(0, v));
    }

    function maxActiveScore(frameScores) {
        let maxScore = 0;

    function pinchDistance(lm) {
        return Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
    }

    function computeHandScores(lm) {
        const isUp = (tip, pip) => lm[tip].y < lm[pip].y;
        const indexUp = isUp(8, 6) ? 1 : 0;
        const middleUp = isUp(12, 10) ? 1 : 0;
        const ringUp = isUp(16, 14) ? 1 : 0;
        const pinkyUp = isUp(20, 18) ? 1 : 0;
        const thumbUp = isUp(4, 3) ? 1 : 0;

        const pinchScore = pinchDistance(lm) < 0.04 ? 1 : 0;
        const fingerGap = Math.hypot(lm[8].x - lm[12].x, lm[8].y - lm[12].y);
        const thumbOut = Math.hypot(lm[4].x - lm[0].x, lm[4].y - lm[0].y) > 0.25;
        const handAngle = Math.abs(Math.atan2(lm[12].y - lm[0].y, lm[12].x - lm[0].x));

        const fourUp = indexUp === 1 && middleUp === 1 && ringUp === 1 && pinkyUp === 1;
        const fourDown = indexUp === 0 && middleUp === 0 && ringUp === 0 && pinkyUp === 0;

        const scores = {
            purple: pinchScore,
            shrine: fourUp && fingerGap < 0.05 ? 1 : 0,
            blue: fourUp && fingerGap > 0.10 ? 1 : 0,
            perfection: fourUp && thumbUp === 1 ? 1 : 0,
            blackflash: fourDown ? 1 : 0,
            love: indexUp === 1 && pinkyUp === 1 && middleUp === 0 && ringUp === 0 && thumbOut ? 1 : 0,
            void: indexUp === 1 && middleUp === 1 && ringUp === 0 && pinkyUp === 0 ? 1 : 0,
            red: indexUp === 1 && middleUp === 0 && ringUp === 0 && pinkyUp === 0 ? 1 : 0,
            ratio: fourUp && fingerGap >= 0.05 && fingerGap <= 0.10 && handAngle > 0.5 && handAngle < 2.5 ? 0.8 : 0
        };

        // Pinch suppresses loosely-related poses so Hollow Purple stays reliable.
        const pinchSuppression = 1 - (pinchScore * 0.45);
        ['shrine', 'blue', 'perfection', 'void', 'red', 'blackflash', 'love', 'ratio'].forEach((tech) => {
            scores[tech] = clamp01(scores[tech] * pinchSuppression);
        });
        return scores;
    }

    function computeFrameScores(results, nowMs) {
        const frameScores = Object.fromEntries(GESTURES.map((tech) => [tech, 0]));
        frameScores.neutral = 1;
        frameFlickScore = 0;
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return frameScores;

        results.multiHandLandmarks.forEach((lm, handIdx) => {
            drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, { color: glowColor, lineWidth: 5 });
            drawLandmarks(canvasCtx, lm, { color: '#fff', lineWidth: 1, radius: 2 });

            const handScores = computeHandScores(lm);
            ACTIVE_GESTURES.forEach((tech) => {
                if (!Object.prototype.hasOwnProperty.call(handScores, tech)) return;
                frameScores[tech] = Math.max(frameScores[tech], handScores[tech]);
            });

            // Flick detection: wrist-relative motion over a short window with straightness filtering.
            const handLabel = results.multiHandedness?.[handIdx]?.label ?? `hand_${handIdx}`;
            const wrist = lm[0];
            const tip = lm[8];
            const relX = tip.x - wrist.x;
            const relY = tip.y - wrist.y;
            const indexUp = lm[8].y < lm[6].y;

            const detector = flickDetectorByHand[handLabel] || { history: [] };
            const history = detector.history;
            history.push({ x: relX, y: relY, t: nowMs });

            while (history.length > 0 && (nowMs - history[0].t) > FLICK.maxWindowMs) {
                history.shift();
            }

            let baseline = null;
            for (let i = history.length - 1; i >= 0; i--) {
                const sample = history[i];
                if ((nowMs - sample.t) >= FLICK.minLagMs) {
                    baseline = sample;
                    break;
                }
            }
            if (!baseline && history.length > 0) {
                baseline = history[0];
            }

            if (baseline) {
                const dtSec = Math.max((nowMs - baseline.t) / 1000, 1 / 120);
                const dx = relX - baseline.x;
                const dy = relY - baseline.y;
                const displacement = Math.hypot(dx, dy);
                const speed = displacement / dtSec;

                let pathLength = 0;
                for (let i = 1; i < history.length; i++) {
                    pathLength += Math.hypot(history[i].x - history[i - 1].x, history[i].y - history[i - 1].y);
                }
                const straightness = pathLength > 0.0001 ? (displacement / pathLength) : 0;

                const speedScore = clamp01((speed - FLICK.minSpeed) / (FLICK.maxSpeed - FLICK.minSpeed));
                const dispScore = clamp01((displacement - FLICK.minDisplacement) / (FLICK.maxDisplacement - FLICK.minDisplacement));
                const straightScore = clamp01((straightness - FLICK.minStraightness) / (FLICK.maxStraightness - FLICK.minStraightness));
                let handFlickScore = (0.5 * speedScore) + (0.35 * dispScore) + (0.15 * straightScore);
                if (!indexUp) handFlickScore *= 0.7;
                frameFlickScore = Math.max(frameFlickScore, handFlickScore);

                const flickTriggered = handFlickScore >= FLICK.triggerScore
                    && (nowMs - lastFlickTriggerMs) >= FLICK.refractoryMs;
                if (flickTriggered) {
                    lastFlickTriggerMs = nowMs;
                    flickPulseUntilMs = nowMs + FLICK.pulseMs;
                }
            }
            flickDetectorByHand[handLabel] = detector;
        });

        // Two-hand gestures (ported from PR #3, #9, #13). They win over single-hand poses.
        if (results.multiHandLandmarks.length === 2) {
            const a = results.multiHandLandmarks[0];
            const b = results.multiHandLandmarks[1];
            const isUpH = (lm, tip, pip) => lm[tip].y < lm[pip].y;
            const isFist = (lm) => !isUpH(lm, 8, 6) && !isUpH(lm, 12, 10) && !isUpH(lm, 16, 14) && !isUpH(lm, 20, 18);
            const isFlat = (lm) => isUpH(lm, 8, 6) && isUpH(lm, 12, 10) && isUpH(lm, 16, 14) && isUpH(lm, 20, 18);
            const isPinch = (lm) => pinchDistance(lm) < 0.07;
            const isILY = (lm) => isUpH(lm, 8, 6) && isUpH(lm, 20, 18) && !isUpH(lm, 12, 10) && !isUpH(lm, 16, 14);
            const wristDist = Math.hypot(a[0].x - b[0].x, a[0].y - b[0].y);
            const thumbDist = Math.hypot(a[4].x - b[4].x, a[4].y - b[4].y);
            const bothIndexMiddleUp = isUpH(a, 8, 6) && isUpH(a, 12, 10) && isUpH(b, 8, 6) && isUpH(b, 12, 10);
            const tipsClose = Math.hypot(a[8].x - b[8].x, a[8].y - b[8].y) < 0.18
                && Math.hypot(a[12].x - b[12].x, a[12].y - b[12].y) < 0.22;

            let twoHandTech = null;
            if (isFist(a) && isFist(b)) twoHandTech = 'divine';
            else if ((isPinch(a) && isFlat(b)) || (isPinch(b) && isFlat(a))) twoHandTech = 'idlegamble';
            else if (thumbDist < 0.05) twoHandTech = 'transfiguration';
            else if (isILY(a) && isILY(b)) twoHandTech = 'palace';
            else if (bothIndexMiddleUp && tipsClose) frameScores.shrine = 1;
            else if (wristDist > 0.08 && wristDist < 0.15) twoHandTech = 'shadowgarden';

            if (twoHandTech) {
                ACTIVE_GESTURES.forEach((tech) => {
                    if (tech !== 'flick') frameScores[tech] *= 0.25;
                });
                frameScores[twoHandTech] = 1;
            }
        }

        frameScores.flick = nowMs <= flickPulseUntilMs ? 1 : 0;
        frameScores.neutral = clamp01(1 - maxActiveScore(frameScores));
        return frameScores;
    }

    function smoothScores(frameScores) {
        GESTURES.forEach((tech) => {
            if (tech === 'flick') {
                // Flick should be immediate; do not smooth it.
                smoothedScores[tech] = frameScores[tech];
                return;
            }
            smoothedScores[tech] += (frameScores[tech] - smoothedScores[tech]) * TUNING.smoothingAlpha;
        });
    }

            voiceStatus = 'UNAVAILABLE';
            updateKeybindMenu();
            return;
        }
        if (!recognition) {
            recognition = new SpeechRecognitionCtor();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.onresult = (event) => {
                const transcript = Array.from(event.results).map((result) => result[0].transcript).join('').toLowerCase();
                const now = performance.now();
                if (now - lastVoiceTriggerMs < VOICE_TRIGGER_COOLDOWN_MS) return;
                if (transcript.includes("don't move")) {
                    lastVoiceTriggerMs = now;
                    flashTriggerText("don't move");
                    forceTechnique('sentence', 6000);
                } else if (transcript.includes('run away')) {
                    lastVoiceTriggerMs = now;
                    flashTriggerText('run away');
                    zoomUntilMs = now + 5000;
                }
            };
            recognition.onerror = () => {
                voiceEnabled = false;
                voiceStatus = 'ERROR';
                updateKeybindMenu();
            };
            recognition.onend = () => {
                if (!voiceEnabled) return;
                try {
                    recognition.start();
                } catch (e) {
                    voiceStatus = 'ERROR';
                    updateKeybindMenu();
                }
            };
        }
        voiceEnabled = enabled;
        if (enabled) {
            try {
                recognition.start();
                voiceStatus = 'LISTENING';
            } catch (e) {
                voiceEnabled = false;
                voiceStatus = 'ERROR';
            }
        } else {
            try {
                recognition.stop();
            } catch (e) { /* already stopped */ }
            voiceStatus = 'OFF';
        }
        updateKeybindMenu();
    }

    function setMusicEnabled(enabled) {
        if (!musicAudio) {
            musicEnabled = false;
            updateKeybindMenu();
            return;
        }

        if (enabled) {
            musicAudio.volume = 0.65;
            const playPromise = musicAudio.play();
            musicEnabled = true;
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {
                    musicEnabled = false;
                    updateKeybindMenu();
                });
            }
        } else {
            musicAudio.pause();
            musicEnabled = false;
        }

        updateKeybindMenu();
    }

    function setKeybindMenuVisibility(visible) {
        keybindMenuVisible = visible;
        keybindMenu.style.display = keybindMenuVisible ? 'block' : 'none';
        if (keybindMenuVisible) updateKeybindMenu();
    }

    function updateDebugPanel(nextGesture) {
        if (!debugEnabled) return;
        const nowMs = performance.now();
        const explosionLeftMs = Math.max(0, purpleExplosionUntilMs - nowMs);
        const flickPulseLeftMs = Math.max(0, flickPulseUntilMs - nowMs);
        const purpleFlickEligibleLeftMs = Math.max(0, purpleFlickEligibleUntilMs - nowMs);
        const lines = [
            'Debug (toggle: D)',
            `currentTech: ${currentTech}`,
            `nextGesture: ${nextGesture}`,
            `flickScore: ${scoreText(frameFlickScore)}`,
            `flickPulse: ${flickPulseLeftMs.toFixed(0)}ms`,
            `purpleFlickEligible: ${purpleFlickEligibleLeftMs.toFixed(0)}ms`,
            `purpleExplosion: ${explosionLeftMs.toFixed(0)}ms`,
            '',
            'gesture   raw      smooth',
            ...GESTURES.map((tech) => {
                const name = tech.padEnd(8, ' ');
                return `${name}${scoreText(rawScores[tech])}   ${scoreText(smoothedScores[tech])}`;
            })
        ];
        debugPanel.textContent = lines.join('\n');
    }

    function triggerPurpleExplosion(nowMs) {
        if ((nowMs - lastPurpleExplosionMs) < 400) return;
        lastPurpleExplosionMs = nowMs;
        purpleExplosionUntilMs = nowMs + TUNING.purpleExplosionDurationMs;
        neutralLockUntilMs = purpleExplosionUntilMs + TUNING.postExplosionNeutralMs;
    }

    function maybeTriggerPurpleExitExplosion(nextGesture, nowMs) {
        const purpleArmed = nowMs <= purpleFlickEligibleUntilMs;
        const enteringFlick = nextGesture === 'flick' && currentTech !== 'flick';
        if (!purpleArmed || !enteringFlick) return;
        flickLockUntilMs = Math.max(flickLockUntilMs, nowMs + TUNING.purpleExplosionDurationMs);
        triggerPurpleExplosion(nowMs);
    }

    function resetChallenger() {
        challengerGesture = null;
        challengerSinceMs = 0;
    }

    function commitTransition(nextGesture, nowMs) {
        resetChallenger();
        return nextGesture;
    }

    function pickGestureFromScores(nowMs) {
        if (currentTech === 'flick' && nowMs < flickLockUntilMs) {
            return 'flick';
        }
        if (nowMs >= purpleExplosionUntilMs && nowMs < neutralLockUntilMs) {
            return currentTech === 'neutral' ? 'neutral' : commitTransition('neutral', nowMs);
        }

        // Flick-only window after exiting Purple: ignore all other gestures.
        if (nowMs <= purpleFlickEligibleUntilMs && currentTech !== 'flick') {
            const flickReady = pendingPurpleExitFlick || nowMs <= flickPulseUntilMs || rawScores.flick >= 1;
            if (flickReady) {
                pendingPurpleExitFlick = false;
                return commitTransition('flick', nowMs);
            }
            if (nowMs >= purpleFlickEligibleUntilMs) pendingPurpleExitFlick = false;
            return currentTech === 'neutral' ? 'neutral' : commitTransition('neutral', nowMs);
        }

        let bestGesture = 'neutral';
        let bestScore = 0;

        ACTIVE_GESTURES.forEach((tech) => {
            // Outside flick-only window, normal gesture competition excludes flick.
            if (tech === 'flick') return;
            if (smoothedScores[tech] > bestScore) {
                bestScore = smoothedScores[tech];
                bestGesture = tech;
            }
        });

        const activeScore = currentTech === 'neutral' ? smoothedScores.neutral : smoothedScores[currentTech];

        if (currentTech !== 'neutral') {
            const challengerIsStronger = bestGesture !== currentTech
                && bestScore >= TUNING.enterThreshold
                && (bestScore - activeScore) >= TUNING.switchMargin;

            if (challengerIsStronger) {
                return commitTransition(bestGesture, nowMs);
            }

            const hasTimedChallenger = bestGesture !== currentTech
                && bestScore >= TUNING.enterThreshold
                && bestScore > activeScore;

            if (hasTimedChallenger) {
                if (challengerGesture !== bestGesture) {
                    challengerGesture = bestGesture;
                    challengerSinceMs = nowMs;
                } else {
                    const heldMs = nowMs - challengerSinceMs;
                    const timedOverrideReady = heldMs >= TUNING.sustainedSwitchMs
                        && (bestScore - activeScore) >= TUNING.sustainedSwitchMargin;
                    if (timedOverrideReady) {
                        return commitTransition(bestGesture, nowMs);
                    }
                }
            } else {
                resetChallenger();
            }

            if (activeScore >= TUNING.exitThreshold) {
                return currentTech;
            }

            return commitTransition('neutral', nowMs);
        }

        resetChallenger();
        if (bestScore < TUNING.enterThreshold) {
            return 'neutral';
        }

        return commitTransition(bestGesture, nowMs);
    }

    setDebugVisibility();
    setKeybindMenuVisibility(true);
    setGuideVisibility(true);
    updateKeybindMenu();
    setMusicEnabled(false);
    window.addEventListener('keydown', (event) => {
        if (event.repeat) return;
        const key = event.key.toLowerCase();
        if (key === KEYBINDS.debug.toLowerCase()) {
            debugEnabled = !debugEnabled;
            setDebugVisibility();
            if (debugEnabled) updateDebugPanel(currentTech);
            updateKeybindMenu();
            return;
        }
        if (key === KEYBINDS.music.toLowerCase()) {
            setMusicEnabled(!musicEnabled);
            return;
        }
        if (key === KEYBINDS.menu.toLowerCase()) {
            setKeybindMenuVisibility(!keybindMenuVisible);
            return;
        }
        if (key === KEYBINDS.guide.toLowerCase()) {
            setGuideVisibility(!guideVisible);
            updateKeybindMenu();
            return;
        }
        if (key === KEYBINDS.voice.toLowerCase()) {
            setVoiceEnabled(!voiceEnabled);
            return;
        }
        if (key === KEYBINDS.cycle.toLowerCase()) {
            const now = performance.now();
            const currentIdx = forcedTech && now < forcedUntilMs ? TECH_CYCLE.indexOf(forcedTech) : -1;
            const nextTech = TECH_CYCLE[(currentIdx + 1) % TECH_CYCLE.length];
            forceTechnique(nextTech);
            updateState(nextTech, true);
            updateKeybindMenu();
            return;
        }
        if (key === KEYBINDS.auto.toLowerCase()) {
            forcedTech = null;
            forcedUntilMs = 0;
            updateState('neutral', true);
            return;
        }
        if (key === KEYBINDS.opening.toLowerCase()) {
            window.open('DomainExpansion-infintevoid/DomainExpansion_infinite-void.html', '_blank');
            return;
        }
    });

    const hands = new Hands({locateFile: (file) => `/vendor/mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7 });

    hands.onResults((results) => {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        const nowMs = performance.now();

        const frameScores = computeFrameScores(results, nowMs);
        const purpleArmedNow = currentTech === 'purple' && (nowMs - purpleEnteredAtMs) >= FLICK.purpleArmMs;
        if (purpleArmedNow && (frameScores.flick >= 1 || nowMs <= flickPulseUntilMs)) {
            // Preserve flick intent even if the hand settles into another symbol right after the flick motion.
            pendingPurpleExitFlick = true;
        }
        frameScores.neutral = clamp01(1 - maxActiveScore(frameScores));
        GESTURES.forEach((tech) => { rawScores[tech] = frameScores[tech]; });
        smoothScores(frameScores);
        let nextGesture = pickGestureFromScores(nowMs);
        if (forcedTech) {
            if (nowMs < forcedUntilMs) {
                nextGesture = forcedTech;
            } else {
                forcedTech = null;
            }
        }
        maybeTriggerPurpleExitExplosion(nextGesture, nowMs);
        updateState(nextGesture);
        updateDebugPanel(nextGesture);
    });

    function updateState(tech, force = false) {
        if(!force && currentTech === tech) return;
        const prevTech = currentTech;
        const nowMs = performance.now();
        currentTech = tech;
        if (currentTech === 'flick') {
            // Safety: if flick was manually entered, still lock it for a full release window.
            flickLockUntilMs = Math.max(flickLockUntilMs, nowMs + TUNING.purpleExplosionDurationMs);
        }
        if (currentTech === 'purple') {
            purpleEnteredAtMs = nowMs;
            purpleFlickEligibleUntilMs = 0;
            pendingPurpleExitFlick = false;
        } else if (prevTech === 'purple') {
            // After exiting Purple, open a short flick-only window if Purple was held long enough.
            const purpleHeldLongEnough = (nowMs - purpleEnteredAtMs) >= FLICK.purpleArmMs;
            purpleFlickEligibleUntilMs = purpleHeldLongEnough ? (nowMs + FLICK.flickOnlyWindowMs) : 0;
            if (!purpleHeldLongEnough) pendingPurpleExitFlick = false;
        } else if (nowMs > purpleFlickEligibleUntilMs && currentTech !== 'flick') {
            pendingPurpleExitFlick = false;
        }
        const nameEl = document.getElementById('technique-name');
        shakeIntensity = tech === 'shrine' ? 1.5 : (tech !== 'neutral' ? 0.4 : 0);

        if(tech === 'shrine') { glowColor = '#ff0000'; nameEl.innerText = "Domain Expansion: Malevolent Shrine"; baseBloomStrength = 2.5; }
        else if(tech === 'purple') { glowColor = '#bb00ff'; nameEl.innerText = "Secret Technique: Hollow Purple"; baseBloomStrength = 4.0; }
        else if(tech === 'void') { glowColor = '#00ffff'; nameEl.innerText = "Domain Expansion: Infinite Void"; baseBloomStrength = 2.0; }
        else if(tech === 'red') { glowColor = '#ff3333'; nameEl.innerText = "Reverse Cursed Technique: Red"; baseBloomStrength = 2.5; }
        else if(tech === 'blue') { glowColor = '#4d7dff'; nameEl.innerText = "Limitless: Blue"; baseBloomStrength = 3.0; }
        else if(tech === 'blackflash') { glowColor = '#ff0044'; nameEl.innerText = "Black Flash"; baseBloomStrength = 5.0; }
        else if(tech === 'shadowgarden') { glowColor = '#4466ff'; nameEl.innerText = "Domain Expansion: Chimera Shadow Garden"; baseBloomStrength = 1.5; }
        else if(tech === 'transfiguration') { glowColor = '#ff9fcf'; nameEl.innerText = "Idle Transfiguration"; baseBloomStrength = 2.8; }
        else if(tech === 'ratio') { glowColor = '#ffd700'; nameEl.innerText = "Ratio Technique"; baseBloomStrength = 2.2; }
        else if(tech === 'divine') { glowColor = '#ffd700'; nameEl.innerText = "Divine General: Mahoraga"; baseBloomStrength = 2.5; }
        else if(tech === 'idlegamble') { glowColor = '#aa00ff'; nameEl.innerText = "Domain Expansion: Idle Death Gamble"; baseBloomStrength = 3.5; }
        else if(tech === 'love') { glowColor = '#66ccff'; nameEl.innerText = "Domain Expansion: Authentic Mutual Love"; baseBloomStrength = 3.0; }
        else if(tech === 'sentence') { glowColor = '#ffaa33'; nameEl.innerText = "Domain Expansion: Deadly Sentencing"; baseBloomStrength = 0.6; }
        else if(tech === 'palace') { glowColor = '#ff0000'; nameEl.innerText = "Domain Expansion: Time Cell Moon Palace"; baseBloomStrength = 2.5; }
        else if(tech === 'perfection') { glowColor = '#b060ff'; nameEl.innerText = "Domain Expansion: Self Embodiment of Perfection"; baseBloomStrength = 2.5; }
        else if(tech === 'flick') { glowColor = '#bb88ff'; nameEl.innerText = "Hollow Purple: Release"; baseBloomStrength = 1.4; }
        else { glowColor = '#00ffff'; nameEl.innerText = "Neutral State"; baseBloomStrength = 1.0; }
        idleFlash.classList.toggle('active', tech === 'idlegamble');
        bloomPass.strength = baseBloomStrength;

        if (tech === 'flick') {
            // Keep current Purple-derived target shape while explosion animation runs.
            return;
        }

        for(let i=0; i<COUNT; i++) {
            let p;
            if(tech === 'neutral') {
                if(i < COUNT * 0.05) {
                    const r = 15 + Math.random()*20; const t = Math.random()*6.28; const ph = Math.random()*3.14;
                    p = { x: r*Math.sin(ph)*Math.cos(t), y: r*Math.sin(ph)*Math.sin(t), z: r*Math.cos(ph), r: 0.1, g: 0.1, b: 0.2, s: 0.4 };
                } else p = { x:0, y:0, z:0, r:0, g:0, b:0, s:0 };
            }
            else if(tech === 'red') p = getRed(i);
            else if(tech === 'void') p = getVoid(i);
            else if(tech === 'purple') p = getPurple(i);
            else if(tech === 'shrine') p = getShrine(i);
            else if(tech === 'blue') p = getBlue(i);
            else if(tech === 'blackflash') p = getBlackFlash(i);
            else if(tech === 'shadowgarden') p = getShadowGarden(i);
            else if(tech === 'transfiguration') p = getTransfiguration(i);
            else if(tech === 'ratio') p = getRatio(i);
            else if(tech === 'divine') p = getDivine(i);
            else if(tech === 'idlegamble') p = getIdleDeathGamble(i);
            else if(tech === 'love') p = getAuthenticMutualLove(i);
            else if(tech === 'sentence') p = getDeadlySentencing(i);
            else if(tech === 'palace') p = getPalace(i);
            else if(tech === 'perfection') p = getPerfection(i);

            targetPositions[i*3] = p.x; targetPositions[i*3+1] = p.y; targetPositions[i*3+2] = p.z;
            targetColors[i*3] = p.r; targetColors[i*3+1] = p.g; targetColors[i*3+2] = p.b;
            targetSizes[i] = p.s;
            if (tech === 'purple') {
                // Explosion should always originate from a Purple shape, not from whatever symbol is active later.
                purpleExplosionSourcePositions[i*3] = p.x;
                purpleExplosionSourcePositions[i*3+1] = p.y;
                purpleExplosionSourcePositions[i*3+2] = p.z;
                purpleExplosionSourceSizes[i] = p.s;
            }
        }
    }

    updateState('neutral', true);

    // ?tech=<name> pins one technique (useful for filming a take without gestures).
    const initialTech = new URLSearchParams(window.location.search).get('tech');
    if (initialTech && GESTURES.includes(initialTech)) {
        forcedTech = initialTech;
        forcedUntilMs = Infinity;
        updateState(initialTech, true);
        setGuideVisibility(false);
    }

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            await hands.send({image: videoElement});
        }, width: 640, height: 480
    });
    cameraUtils.start();

    // Animation
    function animate() {
        requestAnimationFrame(animate);
        idleTime += 0.01;
        const zoomTarget = performance.now() < zoomUntilMs ? 120 : INITIAL_CAMERA_Z;
        camera.position.z += (zoomTarget - camera.position.z) * 0.05;

        const pos = particles.geometry.attributes.position.array;
        const col = particles.geometry.attributes.color.array;
        const siz = particles.geometry.attributes.size.array;

        for(let i=0; i<COUNT*3; i++) {
            pos[i] += (targetPositions[i] - pos[i]) * 0.1;
            col[i] += (targetColors[i] - col[i]) * 0.1;
        }
        for(let i=0; i<COUNT; i++) siz[i] += (targetSizes[i] - siz[i]) * 0.1;

        const nowMs = performance.now();
        const explosionTimeLeftMs = purpleExplosionUntilMs - nowMs;
        if (explosionTimeLeftMs > 0) {
            const life = explosionTimeLeftMs / TUNING.purpleExplosionDurationMs;
            const progress = 1 - life;
            const blastDistance = TUNING.purpleExplosionMaxDistance * (1 - Math.pow(1 - progress, 1.9));
            for(let i=0; i<COUNT; i++) {
                const idx = i * 3;
                let sx = purpleExplosionSourcePositions[idx];
                let sy = purpleExplosionSourcePositions[idx + 1];
                let sz = purpleExplosionSourcePositions[idx + 2];
                if (sx === 0 && sy === 0 && sz === 0) {
                    sx = targetPositions[idx];
                    sy = targetPositions[idx + 1];
                    sz = targetPositions[idx + 2];
                }
                let dx = sx;
                let dy = sy;
                let dz = sz;
                let len = Math.hypot(dx, dy, dz);
                if (len < 0.001) {
                    const a = (i / COUNT) * Math.PI * 2;
                    const b = ((i * 13) % COUNT) / COUNT * Math.PI;
                    dx = Math.cos(a) * Math.sin(b);
                    dy = Math.sin(a) * Math.sin(b);
                    dz = Math.cos(b);
                    len = Math.max(Math.hypot(dx, dy, dz), 0.001);
                }
                const variance = 0.84 + ((i % 9) * 0.035);
                const travel = blastDistance * variance;
                pos[idx] = sx + ((dx / len) * travel);
                pos[idx + 1] = sy + ((dy / len) * travel);
                pos[idx + 2] = sz + ((dz / len) * travel);
                col[idx] = PURPLE_EXPLOSION_COLOR.r;
                col[idx + 1] = PURPLE_EXPLOSION_COLOR.g;
                col[idx + 2] = PURPLE_EXPLOSION_COLOR.b;
                siz[i] = purpleExplosionSourceSizes[i] > 0 ? purpleExplosionSourceSizes[i] : siz[i];
            }
            const bloomKick = TUNING.purpleExplosionBloomBoost * life;
            bloomPass.strength = baseBloomStrength + bloomKick;
            const effectiveShake = Math.max(shakeIntensity, 0.95 * life);
            renderer.domElement.style.transform = `translate(${(Math.random()-0.5)*effectiveShake*40}px, ${(Math.random()-0.5)*effectiveShake*40}px)`;
        } else {
            bloomPass.strength = baseBloomStrength;
            if (currentTech === 'idlegamble') {
                bloomPass.strength = 3.0 + Math.sin(idleTime * 2.2) * 1.2;
            } else if (currentTech === 'love') {
                bloomPass.strength = 2.8 + Math.sin(idleTime * 1.8) * 0.5;
            }
            if (shakeIntensity > 0) {
                renderer.domElement.style.transform = `translate(${(Math.random()-0.5)*shakeIntensity*40}px, ${(Math.random()-0.5)*shakeIntensity*40}px)`;
            } else {
                renderer.domElement.style.transform = 'translate(0,0)';
            }
        }

        particles.geometry.attributes.position.needsUpdate = true;
        particles.geometry.attributes.color.needsUpdate = true;
        particles.geometry.attributes.size.needsUpdate = true;
        
        // Technique-specific rotation (ported from PRs #2, #3, #9, #13)
        if(currentTech === 'red') {
            particles.rotation.z -= 0.1;
        } else if (currentTech === 'blue') {
            particles.rotation.y += 0.02;
            particles.rotation.z += 0.01;
        } else if (currentTech === 'blackflash') {
            particles.rotation.x += 0.3;
            particles.rotation.y += 0.3;
        } else if (currentTech === 'purple') {
            particles.rotation.z += 0.2;
            particles.rotation.y += 0.05;
        } else if (currentTech === 'shrine') {
            particles.rotation.set(0, 0, 0);
        } else if (currentTech === 'divine') {
            particles.rotation.y += 0.005;
            particles.rotation.z += 0.005;
        } else if (currentTech === 'idlegamble') {
            particles.rotation.y -= 0.008;
            particles.rotation.z += 0.003;
        } else if (currentTech === 'love') {
            particles.rotation.y += 0.012;
        } else if (currentTech === 'sentence') {
            particles.rotation.set(0, 0, 0);
        } else if (currentTech === 'palace') {
            particles.rotation.y += 0.0005;
        } else if (currentTech === 'perfection') {
            particles.rotation.y += 0.05;
        } else {
            particles.rotation.y += 0.005;
        }

        composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
