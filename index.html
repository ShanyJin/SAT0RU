<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JJK: Cursed Technique</title>
    <style>
        :root{
            --bg-base:#202020; --bg-acrylic:rgba(30,30,32,.55);
            --bg-surface:rgba(255,255,255,.04); --bg-surface-hover:rgba(255,255,255,.08);
            --accent:#D8A657; --accent-hover:#E4B76B; --accent-active:#C99646; --accent-soft:rgba(216,166,87,.16);
            --text-primary:#fff; --text-secondary:rgba(255,255,255,.7); --text-tertiary:rgba(255,255,255,.5);
            --stroke:rgba(255,255,255,.08); --stroke-light:rgba(255,255,255,.12);
            --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
            --blur:20px; --shadow-sm:0 2px 8px rgba(0,0,0,.15); --shadow-md:0 8px 24px rgba(0,0,0,.2);
            --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
            --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
        }
        html[data-accent="cyan"]{ --accent:#66CCFF; --accent-hover:#80D6FF; --accent-active:#4DB8EB; --accent-soft:rgba(102,204,255,.16); }

        body { margin: 0; overflow: hidden; height: 100vh; background: var(--bg-base); color: var(--text-primary); font-family: var(--font); }

        /* Camera stage: feed and particles share one full-bleed layer. */
        .input_video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: .92; z-index: 0; background: var(--bg-base); }
        .stage-shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: linear-gradient(to bottom, rgba(18,18,20,.55), rgba(18,18,20,.12) 140px, rgba(18,18,20,0) 320px),
                        radial-gradient(ellipse at center, rgba(18,18,20,0) 55%, rgba(18,18,20,.42) 100%); }
        #output_canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 2; pointer-events: none; }
        #three-canvas { position: fixed; inset: 0; z-index: 3; mix-blend-mode: screen; pointer-events: none; }
        #grain {
            position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: .05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        }

        /* Top bar */
        #ui { position: fixed; top: 0; left: 0; right: 0; height: 56px; box-sizing: border-box; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 16px; background: var(--bg-acrylic); backdrop-filter: blur(var(--blur)) saturate(150%); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); border-bottom: 1px solid var(--stroke); box-shadow: var(--shadow-sm); pointer-events: none; }
        #ui h1 { display: flex; align-items: baseline; gap: 10px; margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .02em; color: var(--text-primary); }
        #ui h1 .sub { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); }
        #technique-name { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border: 1px solid rgba(216,166,87,.28); border-radius: var(--radius-pill); padding: 6px 12px; white-space: nowrap; }
        /* 虚式「茈」 mode switch: centered in the top bar, deliberately clickable while the rest of #ui is not. */
        #purple-mode-btn {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 38px; height: 38px; padding: 0; z-index: 2;
            display: grid; place-items: center;
            font-family: var(--font); font-size: 18px; font-weight: 600; line-height: 1;
            color: var(--text-secondary); cursor: pointer; pointer-events: auto;
            background: rgba(20,16,28,.58); border: 1px solid rgba(187,0,255,.26);
            border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
            backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%);
            transition: color .2s, background .2s, border-color .2s, box-shadow .2s;
        }
        #purple-mode-btn:hover { color: #e9d5ff; border-color: rgba(187,0,255,.6); background: rgba(45,24,60,.68); }
        #purple-mode-btn.active {
            color: #f3e8ff; background: rgba(88,28,135,.38);
            border-color: rgba(187,0,255,.88);
            box-shadow: 0 0 18px rgba(187,0,255,.38), inset 0 0 12px rgba(187,0,255,.18);
        }
        #purple-mode-btn.active::before {
            content: ''; position: absolute; inset: -5px; border-radius: 50%;
            border: 1px solid rgba(187,0,255,.3); pointer-events: none;
            animation: purpleModePulse 2.4s ease-in-out infinite;
        }
        #purple-mode-btn.cooling::after {
            content: ''; position: absolute; inset: -5px; border-radius: 50%; pointer-events: none;
            background: conic-gradient(rgba(187,0,255,.92) calc(var(--cd, 0) * 1turn), rgba(255,255,255,.07) 0);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        }
        @keyframes purpleModePulse {
            0%, 100% { opacity: .35; transform: scale(1); }
            50% { opacity: .9; transform: scale(1.08); }
        }

        /* Left rail: keybinds + gesture guide */
        #left-rail { position: fixed; top: 68px; left: 16px; z-index: 90; display: flex; flex-direction: column; gap: 12px; width: 300px; max-height: calc(100vh - 84px); pointer-events: none; }
        #keybind-menu, #gesture-guide, #debug-panel { background: var(--bg-acrylic); backdrop-filter: blur(var(--blur)) saturate(150%); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); border: 1px solid var(--stroke); border-top-color: var(--stroke-light); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
        #keybind-menu { display: block; box-sizing: border-box; width: 100%; padding: 12px 14px; }
        #gesture-guide { display: block; box-sizing: border-box; width: 100%; padding: 12px 14px; overflow-y: auto; pointer-events: auto; scrollbar-width: thin; scrollbar-color: var(--stroke) transparent; }
        #debug-panel { position: fixed; top: 68px; right: 16px; z-index: 90; display: none; box-sizing: border-box; width: 300px; max-height: calc(100vh - 84px); padding: 12px 14px; color: var(--text-secondary); font: 12px/1.45 var(--mono); white-space: pre; overflow: hidden; pointer-events: none; }

        .panel-title { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 8px; }
        .kb-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
        .kb-key { font: 500 11px/1 var(--mono); color: var(--text-secondary); background: var(--bg-surface); border: 1px solid var(--stroke); border-radius: var(--radius-sm); padding: 3px 6px; min-width: 14px; text-align: center; }
        .kb-label { flex: 1; color: var(--text-secondary); }
        .kb-value { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); }
        .guide-sep { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); margin: 8px 0 2px; }
        .guide-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 0; }
        .guide-gesture { font-size: 12px; color: var(--text-secondary); }
        .guide-tech { font-size: 12px; font-weight: 500; color: var(--text-primary); text-align: right; }
        .guide-foot { margin-top: 8px; font-size: 11px; line-height: 1.5; color: var(--text-tertiary); }

        #idle-flash {
            position: fixed; inset: 0; pointer-events: none; z-index: 5;
            opacity: 0;
            background: radial-gradient(ellipse at center, rgba(80,0,120,0.3) 0%, transparent 70%);
            transition: opacity 0.5s ease;
        }
        #idle-flash.active { animation: idlePulse 2.5s ease-in-out infinite; }
        @keyframes idlePulse {
            0% { opacity: 0; }
            40% { opacity: 1; }
            60% { opacity: 0.6; }
            100% { opacity: 0; }
        }

        #trigger-word-text {
            position: fixed; left: 50%; top: 42%; transform: translateX(-50%); z-index: 120;
            font-size: 44px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
            color: var(--text-primary); text-shadow: 0 2px 24px rgba(0,0,0,.55);
            pointer-events: none;
        }
        @keyframes flicker {
            0% { opacity: 1; } 50% { opacity: 1; } 75% { opacity: 1; }
            80% { opacity: 0; } 82% { opacity: 1; } 84% { opacity: 0; }
            88% { opacity: 1; } 90% { opacity: 0; } 92% { opacity: 1; }
            95% { opacity: 0; } 97% { opacity: 1; } 100% { opacity: 0; }
        }

        body.clean-mode #ui, body.clean-mode #left-rail, body.clean-mode #debug-panel, body.clean-mode #trigger-word-text { display: none !important; }

        @media (max-width: 900px) {
            #ui h1 .sub { display: none; }
            #left-rail { width: min(300px, 48vw); }
            #debug-panel { width: min(300px, 48vw); }
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "/vendor/three/build/three.module.js",
                "three/addons/": "/vendor/three/examples/jsm/"
            }
        }
    </script>
    <script src="/vendor/mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="/vendor/mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="/vendor/mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <audio id="bg-audio" src="ost.mp3" preload="auto" loop></audio>

    <video class="input_video"></video>
    <div class="stage-shade"></div>
    <canvas id="output_canvas"></canvas>
    <div id="grain"></div>
    <div id="idle-flash"></div>

    <header id="ui">
        <h1>呪術廻戦 <span class="sub">Domain Expansion</span></h1>
        <button id="purple-mode-btn" type="button" aria-pressed="false" title="虚式「茈」">茈</button>
        <div id="technique-name">NEUTRAL STATE</div>
    </header>
    <div id="trigger-word-text"></div>

    <div id="left-rail">
        <div id="keybind-menu"></div>
        <div id="gesture-guide"></div>
    </div>
    <div id="debug-panel"></div>

<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- Scene & Rendering ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 55;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.domElement.id = 'three-canvas';
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.domElement.style.position = 'fixed';
    renderer.domElement.style.top = '0';
    renderer.domElement.style.left = '0';
    renderer.domElement.style.zIndex = '1';
    renderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(renderer.domElement);
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    composer.addPass(bloomPass);

    const COUNT = 20000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const sizes = new Float32Array(COUNT);
    
    const targetPositions = new Float32Array(COUNT * 3);
    const targetColors = new Float32Array(COUNT * 3);
    const targetSizes = new Float32Array(COUNT);
    const purpleExplosionSourcePositions = new Float32Array(COUNT * 3);
    const purpleExplosionSourceSizes = new Float32Array(COUNT);

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const particleMaterial = new THREE.PointsMaterial({
        size: 0.3,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
    });

    const particles = new THREE.Points(geometry, particleMaterial);
    scene.add(particles);

    // --- Blue charge orb (蒼「构筑」): a separate particle cluster anchored to the hand ---
    // After the open>fist>open cycle it converges to a spinning point that follows the hand;
    // a fling / leaving the frame / losing tracking releases the main Blue blast.
    const ORB_COUNT = 4000;
    const orbGeometry = new THREE.BufferGeometry();
    const orbPositions = new Float32Array(ORB_COUNT * 3);
    const orbColors = new Float32Array(ORB_COUNT * 3);
    // A uniform random shell reads as a static glowing ball even while it spins. Three tilted
    // arc rings (one counter-rotating) make the orbit unmistakable; a dim haze fills volume.
    const ORB_RINGS = [
        { u: [1, 0, 0], w: [0, 0.42, 0.91], spin: 2.6, scale: 1.0 },
        { u: [0.87, 0, -0.5], w: [0.36, 0.8, 0.48], spin: 1.7, scale: 0.82 },
        { u: [1, 0, 0], w: [0, 1, 0], spin: -2.1, scale: 1.22 }
    ];
    const ORB_ARC_BASE = [0, 1.9, 3.4, 5.1];
    const orbSeeds = [];
    for (let i = 0; i < ORB_COUNT; i++) {
        const frac = i / ORB_COUNT;
        let c;
        if (frac < 0.12) {
            orbSeeds.push({
                type: 'core',
                r: 0.05 + Math.random() * 0.25,
                phi: Math.acos(2 * Math.random() - 1),
                theta: Math.random() * Math.PI * 2,
                spin: 2.4 + Math.random() * 2.6,
                wobble: 0.4 + Math.random() * 1.2,
                phase: Math.random() * Math.PI * 2
            });
            c = { r: 0.42, g: 0.62, b: 0.98 };
        } else if (frac < 0.67) {
            const k = i % 3;
            orbSeeds.push({
                type: 'ring',
                k,
                r: Math.min(1, ORB_RINGS[k].scale),
                theta0: ORB_ARC_BASE[(i * 7) % 4] + (Math.random() + Math.random() + Math.random() - 1.5) * 0.35,
                rj: 1 + (Math.random() - 0.5) * 0.12
            });
            c = k === 0 ? { r: 0.38, g: 0.6, b: 1.0 }
                : k === 1 ? { r: 0.3, g: 0.52, b: 0.95 }
                : { r: 0.22, g: 0.42, b: 0.88 };
        } else {
            orbSeeds.push({
                type: 'haze',
                r: 0.3 + Math.random() * 1.3,
                phi: Math.acos(2 * Math.random() - 1),
                theta: Math.random() * Math.PI * 2,
                spin: 1.9 + Math.random() * 0.9,
                wobble: 0.5 + Math.random() * 1.5,
                phase: Math.random() * Math.PI * 2
            });
            c = Math.random() < 0.3 ? { r: 0.25, g: 0.5, b: 0.95 } : { r: 0.08, g: 0.22, b: 0.7 };
        }
        orbColors[i * 3] = c.r;
        orbColors[i * 3 + 1] = c.g;
        orbColors[i * 3 + 2] = c.b;
    }
    orbGeometry.setAttribute('position', new THREE.BufferAttribute(orbPositions, 3));
    orbGeometry.setAttribute('color', new THREE.BufferAttribute(orbColors, 3));
    const orbMaterial = new THREE.PointsMaterial({
        size: 0.3,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
    });
    const chargeOrb = new THREE.Points(orbGeometry, orbMaterial);
    chargeOrb.visible = false;
    chargeOrb.frustumCulled = false;
    scene.add(chargeOrb);

    // --- Purple charge orb (虚式「茈」): a small violet ball that becomes the projectile ---
    // Smaller and denser than Blue's orb: a bright core, two/three ring arcs, and a haze.
    // The same buffer is reused while charging and while flying to the screen center.
    const PURPLE_ORB_COUNT = 700;
    const purpleOrbGeometry = new THREE.BufferGeometry();
    const purpleOrbPositions = new Float32Array(PURPLE_ORB_COUNT * 3);
    const purpleOrbColors = new Float32Array(PURPLE_ORB_COUNT * 3);
    const purpleOrbSeeds = [];
    for (let i = 0; i < PURPLE_ORB_COUNT; i++) {
        const frac = i / PURPLE_ORB_COUNT;
        let c;
        if (frac < 0.08) {
            purpleOrbSeeds.push({
                type: 'core',
                r: 0.05 + Math.random() * 0.2,
                phi: Math.acos(2 * Math.random() - 1),
                theta: Math.random() * Math.PI * 2,
                spin: 2.4 + Math.random() * 2.6,
                wobble: 0.4 + Math.random() * 1.2,
                phase: Math.random() * Math.PI * 2
            });
            c = { r: 0.7, g: 0.42, b: 1.0 };
        } else if (frac < 0.66) {
            const k = i % 3;
            purpleOrbSeeds.push({
                type: 'ring',
                k,
                r: Math.min(1, ORB_RINGS[k].scale),
                theta0: ORB_ARC_BASE[(i * 7) % 4] + (Math.random() + Math.random() + Math.random() - 1.5) * 0.35,
                rj: 1 + (Math.random() - 0.5) * 0.12
            });
            c = k === 0 ? { r: 0.56, g: 0.26, b: 0.96 }
                : k === 1 ? { r: 0.46, g: 0.16, b: 0.86 }
                : { r: 0.32, g: 0.07, b: 0.66 };
        } else {
            purpleOrbSeeds.push({
                type: 'haze',
                r: 0.3 + Math.random() * 1.2,
                phi: Math.acos(2 * Math.random() - 1),
                theta: Math.random() * Math.PI * 2,
                spin: 1.9 + Math.random() * 0.9,
                wobble: 0.5 + Math.random() * 1.5,
                phase: Math.random() * Math.PI * 2
            });
            c = Math.random() < 0.35 ? { r: 0.4, g: 0.13, b: 0.78 } : { r: 0.16, g: 0.03, b: 0.45 };
        }
        purpleOrbColors[i * 3] = c.r;
        purpleOrbColors[i * 3 + 1] = c.g;
        purpleOrbColors[i * 3 + 2] = c.b;
    }
    purpleOrbGeometry.setAttribute('position', new THREE.BufferAttribute(purpleOrbPositions, 3));
    purpleOrbGeometry.setAttribute('color', new THREE.BufferAttribute(purpleOrbColors, 3));
    const purpleOrbMaterial = new THREE.PointsMaterial({
        size: 0.28,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
    });
    const purpleOrb = new THREE.Points(purpleOrbGeometry, purpleOrbMaterial);
    purpleOrb.visible = false;
    purpleOrb.frustumCulled = false;
    scene.add(purpleOrb);
    let purpleSpinPhase = 0;
    let purplePrevAngle = null;

    // --- Ambient dust: the standby particles, and proof of Blue's pull / Red's push ---
    // Idle they drift like dust in the room. While Blue charges they spiral inward and orbit
    // the blue ball (following the hand); while Red is out they get shoved into a clean rim
    // around the red core; Blue's release blasts them outward.
    const DUST_COUNT = 1200;
    const dustGeometry = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(DUST_COUNT * 3);
    const dustColors = new Float32Array(DUST_COUNT * 3);
    const dustSeeds = [];
    for (let i = 0; i < DUST_COUNT; i++) {
        const seed = {
            bx: (Math.random() - 0.5) * 112,
            by: (Math.random() - 0.5) * 78,
            bz: (Math.random() - 0.5) * 26,
            driftPhase: Math.random() * Math.PI * 2,
            driftSpeed: 0.15 + Math.random() * 0.35,
            driftAmp: 1.5 + Math.random() * 3.5,
            orbitR: 9 + Math.random() * 8,
            orbitSpeed: (0.5 + Math.random() * 0.9) * (Math.random() < 0.5 ? -1 : 1),
            orbitPhase: Math.random() * Math.PI * 2,
            tau: 0.18 + Math.random() * 0.30 // per-particle follow lag => smooth hand-offs
        };
        dustSeeds.push(seed);
        const b = 0.1 + Math.random() * 0.18;
        dustColors[i * 3] = b * 0.75;
        dustColors[i * 3 + 1] = b * 0.85;
        dustColors[i * 3 + 2] = b * 1.25;
        dustPositions[i * 3] = seed.bx;
        dustPositions[i * 3 + 1] = seed.by;
        dustPositions[i * 3 + 2] = seed.bz;
    }
    dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    dustGeometry.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));
    const dustMaterial = new THREE.PointsMaterial({
        size: 0.34,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.65,
        depthWrite: false
    });
    const dust = new THREE.Points(dustGeometry, dustMaterial);
    dust.frustumCulled = false;
    scene.add(dust);
    let lastDustMs = 0;

    // Rings spin rigidly (same phase for every particle in a ring, so arcs never smear);
    // haze particles drift and breathe; everything also trails along the orb's recent path.
    function fillOrbPositions(nowSec, radius, path, cx, cy) {
        const n = path ? path.length : 0;
        for (let i = 0; i < ORB_COUNT; i++) {
            const s = orbSeeds[i];
            let x;
            let y;
            let z;
            if (s.type === 'ring') {
                const R = ORB_RINGS[s.k];
                const theta = s.theta0 + nowSec * R.spin + orbSpinPhase;
                const rad = radius * R.scale * s.rj;
                const ct = Math.cos(theta);
                const st = Math.sin(theta);
                x = (R.u[0] * ct + R.w[0] * st) * rad;
                y = (R.u[1] * ct + R.w[1] * st) * rad;
                z = (R.u[2] * ct + R.w[2] * st) * rad;
            } else {
                const theta = s.theta + nowSec * s.spin + orbSpinPhase;
                const wob = Math.sin(nowSec * s.wobble + s.phase) * (s.type === 'core' ? 0.08 : 0.26);
                const rr = radius * s.r * (1 + wob);
                x = rr * Math.sin(s.phi) * Math.cos(theta);
                y = rr * Math.cos(s.phi) * 0.82;
                z = rr * Math.sin(s.phi) * Math.sin(theta);
            }
            let ox = 0;
            let oy = 0;
            if (n > 1) {
                const idx = Math.max(0, Math.min(n - 1, Math.floor((1 - s.r) * (n - 1))));
                ox = path[idx].x - cx;
                oy = path[idx].y - cy;
                const ol = Math.hypot(ox, oy);
                if (ol > 10) {
                    ox *= 10 / ol;

    // Same geometry as Blue's orb, but violet, smaller, and only the haze layer trails along
    // the recent path so the core and rings stay a readable ball while it moves or flies.
    function fillPurpleOrbPositions(nowSec, radius, path, cx, cy) {
        const n = path ? path.length : 0;
        for (let i = 0; i < PURPLE_ORB_COUNT; i++) {
            const s = purpleOrbSeeds[i];
            let x;
            let y;
            let z;
            if (s.type === 'ring') {
                const R = ORB_RINGS[s.k];
                const theta = s.theta0 + nowSec * R.spin + purpleSpinPhase;
                const rad = radius * R.scale * s.rj;
                const ct = Math.cos(theta);
                const st = Math.sin(theta);
                x = (R.u[0] * ct + R.w[0] * st) * rad;
                y = (R.u[1] * ct + R.w[1] * st) * rad;
                z = (R.u[2] * ct + R.w[2] * st) * rad;
            } else {
                const theta = s.theta + nowSec * s.spin + purpleSpinPhase;
                const wob = Math.sin(nowSec * s.wobble + s.phase) * (s.type === 'core' ? 0.08 : 0.26);
                const rr = radius * s.r * (1 + wob);
                x = rr * Math.sin(s.phi) * Math.cos(theta);
                y = rr * Math.cos(s.phi) * 0.82;
                z = rr * Math.sin(s.phi) * Math.sin(theta);
            }
            let ox = 0;
            let oy = 0;
            if (s.type === 'haze' && n > 1) {
                const idx = Math.max(0, Math.min(n - 1, Math.floor((1 - s.r) * (n - 1))));
                ox = path[idx].x - cx;
                oy = path[idx].y - cy;
                const ol = Math.hypot(ox, oy);
                if (ol > 6) {
                    ox *= 6 / ol;
                    oy *= 6 / ol;
                }
            }
            purpleOrbPositions[i * 3] = x + ox;
            purpleOrbPositions[i * 3 + 1] = y + oy;

    function handPointToWorld(nx, ny) {
        // The feed is displayed mirrored (selfie) and object-fit: cover crops part of the frame,
        // so map the landmark through the visible source rect before converting to world space.
        const vw = videoElement.videoWidth || 640;
        const vh = videoElement.videoHeight || 480;
        const scale = Math.max(window.innerWidth / vw, window.innerHeight / vh);
        const visW = Math.min(vw, window.innerWidth / scale) / vw;
        const visH = Math.min(vh, window.innerHeight / scale) / vh;
        const sx = (nx - (1 - visW) / 2) / visW;
        const sy = (ny - (1 - visH) / 2) / visH;
        const halfH = Math.tan((camera.fov * Math.PI) / 360) * camera.position.z;
        const halfW = halfH * camera.aspect;
        return { x: (1 - 2 * sx) * halfW, y: (1 - 2 * sy) * halfH };
    }

        t.prevSize = size;
        t.prevSizeMs = nowMs;
        return pushNow;
    }

    // Tracks the anchored hand while charging. Returns 'charge' to keep constructing,
    // 'release' to fire the blast. Dragging and wrist rotation just carry the orb along;
    // only a sustained forward push (palm scale growing toward the camera), leaving the
    // frame, 合掌, or lost tracking fires.
    function updateBlueCharge(landmarks, keys, nowMs) {
        const c = blueCharge;
        let lm = null;
        let idx = -1;
        let reanchored = false;
        for (let i = 0; i < landmarks.length; i++) {
            if (keys[i] === c.key) {
                lm = landmarks[i];
                idx = i;
                break;
            }
        }
        if (!lm) {
            // Handedness labels can flip while turning the hand; re-acquire a nearby hand instead.
            let bestDist = 0.30;
            for (let i = 0; i < landmarks.length; i++) {
                const p = palmState(landmarks[i]);
                const d = Math.hypot(p.cx - c.x, p.cy - c.y);
                if (d < bestDist) {
                    bestDist = d;
                    lm = landmarks[i];
                    idx = i;
                }
            }
            if (lm) {
                c.key = keys[idx];
                reanchored = true; // don't judge the jump between hands
                c.prevAngle = null;
            }
        }
        if (!lm) {
            const since = nowMs - c.lastSeenMs;
            // Detection hiccups are common; give the hand a full second to come back
            // before treating the charge as lost.
            return (since > CHARGE.lostMs || nowMs - c.startedMs > CHARGE.maxChargeMs) ? 'release' : 'charge';
        }
        const p = palmState(lm);
        if (reanchored) {
            c.prevSize = p.size;
            c.prevSizeMs = nowMs;
            c.growSamples = 0;
        }

        const outOfFrame = p.cx < -CHARGE.outMargin || p.cx > 1 + CHARGE.outMargin
            || p.cy < -CHARGE.outMargin || p.cy > 1 + CHARGE.outMargin;
        c.outFrames = outOfFrame ? c.outFrames + 1 : 0;

        // 合掌: another hand's palm comes right up against the anchored palm.
        let minPalmGap = Infinity;
        for (let i2 = 0; i2 < landmarks.length; i2++) {
            if (i2 === idx) continue;
            const other = palmState(landmarks[i2]);
            minPalmGap = Math.min(minPalmGap, Math.hypot(other.cx - p.cx, other.cy - p.cy));
        }
        c.palmFrames = minPalmGap < CHARGE.palmGap ? c.palmFrames + 1 : 0;

        // Wrist roll drives the swarm's spin, so the orb rotates with the hand.
        const palmAngle = Math.atan2(lm[9].y - lm[0].y, lm[9].x - lm[0].x);
        if (c.prevAngle !== null) {
            let dA = palmAngle - c.prevAngle;
            if (dA > Math.PI) dA -= Math.PI * 2;
            else if (dA < -Math.PI) dA += Math.PI * 2;
            dA = Math.max(-0.8, Math.min(0.8, dA));
            orbSpinPhase -= dA * 1.6; // the feed is mirrored: match the rotation the user sees
        }
        c.prevAngle = palmAngle;

        // Shared sustained-forward-push detector. Blue and 茈 both use this exact chain.
        const pushNow = updatePushTracker(c, p.size, nowMs);

        c.x = p.cx;
        c.y = p.cy;
        c.size = p.size;
        c.lastSeenMs = nowMs;
        const tooLong = (nowMs - c.startedMs) > CHARGE.maxChargeMs;
        return (c.outFrames >= CHARGE.outFrames || pushNow
            || c.palmFrames >= CHARGE.palmGapFrames || tooLong) ? 'release' : 'charge';
    }

    // 茈's two ready poses plus the thumb-under firing form. The gun form (thumb flared) is
    // Red's second pose in normal mode; the mode switch decides which technique owns it.
    function purplePoseInfo(shape) {
        const twoFingers = shape.indexUp === 1 && shape.middleUp === 1
            && shape.ringUp === 0 && shape.pinkyUp === 0 && shape.fingerGap < 0.065;
        return {
            gun: twoFingers && shape.thumbGapRatio > 0.75,
            thumbUnder: twoFingers && shape.thumbGapRatio <= 0.75,
            pinch: shape.pinchScore === 1
        };
    }

    // The orb sits just past the gun fingertips, or just past a pinch. The offset keeps it
    // visually in front of the hand instead of inside the palm.
    function purpleWorldAnchor(lm, shape) {
        const pinch = shape.pinchScore === 1;
        const nx = pinch ? (lm[4].x + lm[8].x) / 2 : (lm[8].x + lm[12].x) / 2;
        const ny = pinch ? (lm[4].y + lm[8].y) / 2 : (lm[8].y + lm[12].y) / 2;
        const tip = handPointToWorld(nx, ny);
        const wrist = handPointToWorld(lm[0].x, lm[0].y);
        const dx = tip.x - wrist.x;
        const dy = tip.y - wrist.y;
        const len = Math.hypot(dx, dy) || 1;
        const gap = pinch ? 2.0 : 3.5;
        return { x: tip.x + (dx / len) * gap, y: tip.y + (dy / len) * gap };
    }

    function updatePurpleVisual(lm, shape, nowMs) {
        const anchor = purpleWorldAnchor(lm, shape);
        if (!purpleVisual.init) {
            purpleVisual.x = anchor.x;
            purpleVisual.y = anchor.y;
            purpleVisual.t = nowMs;
            purpleVisual.init = true;
            return;
        }
        const dtSec = Math.min(0.1, Math.max(0.001, (nowMs - purpleVisual.t) / 1000));
        const k = 1 - Math.exp(-dtSec / (PURPLE_CAST.followTauMs / 1000));
        purpleVisual.x += (anchor.x - purpleVisual.x) * k;
        purpleVisual.y += (anchor.y - purpleVisual.y) * k;
        purpleVisual.t = nowMs;
    }

    function createPurpleCharge(key, lm, shape, nowMs) {
        const p = palmState(lm);
        const ready = purplePoseInfo(shape).thumbUnder;
        purpleCharge = {
            key,
            x: p.cx,
            y: p.cy,
            size: p.size,
            startedMs: nowMs,
            lastSeenMs: nowMs,
            poseSeenMs: nowMs,
            prevSize: p.size,
            prevSizeMs: nowMs,
            growSamples: 0,
            growStartMs: nowMs,
            growStartSize: p.size,
            lastGrowth: 0,
            thumbUnderAtMs: ready ? nowMs : 0, // last frame the thumb was tucked under the two fingers
            thumbUnderRatio: ready ? shape.thumbGapRatio : 0 // ...and its ratio, for the snap jump test
        };
        purpleVisual.init = false;
        purplePrevAngle = null;
        updatePurpleVisual(lm, shape, nowMs);
        const nameEl = document.getElementById('technique-name');
        if (nameEl) nameEl.innerText = '虚式「茈」 · 構築中';
    }

    function cancelPurpleCharge() {
        purpleCharge = null;
        purpleVisual.init = false;
        purplePrevAngle = null;
        purplePath.length = 0;
        const nameEl = document.getElementById('technique-name');
        if (nameEl && purpleMode) nameEl.innerText = '虚式「茈」';
    }

    function firePurpleCharge(nowMs) {
        if (!purpleCharge) return;
        const start = purpleVisual.init
            ? { x: purpleVisual.x, y: purpleVisual.y }
            : handPointToWorld(purpleCharge.x, purpleCharge.y);
        purpleCharge = null;
        purpleVisual.init = false;
        purpleShot = {
            startX: start.x,
            startY: start.y,
            startMs: nowMs,
            durationMs: PURPLE_CAST.shotMs
        };
        purpleCooldownUntilMs = nowMs + PURPLE_CAST.cooldownMs;
        techCooldownUntilMs = Math.max(techCooldownUntilMs, nowMs + PURPLE_CAST.cooldownMs);
        const nameEl = document.getElementById('technique-name');
        if (nameEl) nameEl.innerText = '虚式「茈」 · 射出';
        shakeIntensity = Math.max(shakeIntensity, 0.5);
    }

    function impactPurpleShot(nowMs) {
        purpleShot = null;
        forceTechnique('purple', TUNING.purpleExplosionDurationMs, nowMs);
        updateState('purple', true);
        // A projectile hit is a point blast, not the full Purple field shell. Tiny non-zero
        // sources avoid the explosion code's target-shape fallback while still reading as center.
        for (let i = 0; i < COUNT; i++) {
            purpleExplosionSourcePositions[i * 3] = 0.0001;
            purpleExplosionSourcePositions[i * 3 + 1] = 0.0001;
            purpleExplosionSourcePositions[i * 3 + 2] = 0.0001;
            purpleExplosionSourceSizes[i] = targetSizes[i];
        }
        triggerPurpleExplosion(nowMs);
        const nameEl = document.getElementById('technique-name');
        if (nameEl) nameEl.innerText = '虚式「茈」';
    }

    // Runs only while the 茈 switch is ON. It owns the gun/pinch charge; firing triggers are
    // added by the push/flick tasks. No Blue/Red score ever escapes this mode.
    function updatePurpleMode(landmarks, shapes, keys, nowMs, flicks = null) {
        if (!purpleMode) return;
        const keyOf = (i) => keys[i] || `hand_${i}`;

        // The projectile keeps flying during the cooldown it just started.
        if (purpleShot) {
            if ((nowMs - purpleShot.startMs) >= purpleShot.durationMs) impactPurpleShot(nowMs);
            return;
        }

        if (nowMs < techCooldownUntilMs) {
            if (purpleCharge) cancelPurpleCharge();
            purplePoseRun = 0;
            purplePoseKey = null;
            return;
        }

        if (landmarks.length === 0) {
            purplePoseRun = 0;
            purplePoseKey = null;
            // Once the thumb is tucked the user is ready to snap; a fast flick can briefly
            // lose the hand, so keep the charge a little longer before giving up on it.
            const readyGrace = purpleCharge
                && (nowMs - purpleCharge.thumbUnderAtMs) <= PURPLE_CAST.snapWindowMs;
            const graceMs = readyGrace ? PURPLE_CAST.readyGraceMs : PURPLE_CAST.poseGraceMs;
            if (purpleCharge && (nowMs - purpleCharge.lastSeenMs) > graceMs) {
                cancelPurpleCharge();
            }
            return;
        }

        if (!purpleCharge) {
            let chargeIdx = -1;
            for (let i = 0; i < shapes.length; i++) {
                const info = purplePoseInfo(shapes[i]);
                // The tucked-thumb ready pose can arm the orb directly; the user can then
                // snap the thumb out to fire without first forming the flared gun.
                if (info.gun || info.pinch || info.thumbUnder) {
                    chargeIdx = i;
                    break;
                }
            }
            if (chargeIdx >= 0 && keyOf(chargeIdx) === purplePoseKey) {
                purplePoseRun += 1;
            } else {
                purplePoseKey = chargeIdx >= 0 ? keyOf(chargeIdx) : null;
                purplePoseRun = chargeIdx >= 0 ? 1 : 0;
            }
            if (chargeIdx >= 0 && purplePoseRun >= PURPLE_CAST.poseHoldFrames) {
                createPurpleCharge(keyOf(chargeIdx), landmarks[chargeIdx], shapes[chargeIdx], nowMs);
                purplePoseRun = 0;
                purplePoseKey = null;
            }
            return;
        }

        // The charge owns one hand. Re-anchor by handedness label, then by nearby palm.
        const c = purpleCharge;
        let idx = -1;
        for (let i = 0; i < keys.length; i++) {
            if (keyOf(i) === c.key) {
                idx = i;
                break;
            }
        }
        if (idx < 0) {
            let best = 0.30;
            for (let i = 0; i < landmarks.length; i++) {
                const p = palmState(landmarks[i]);
                const d = Math.hypot(p.cx - c.x, p.cy - c.y);
                if (d < best) {
                    best = d;
                    idx = i;
                }
            }
            if (idx >= 0) c.key = keyOf(idx);
        }
        if (idx < 0) {
            if ((nowMs - c.lastSeenMs) > PURPLE_CAST.poseGraceMs) cancelPurpleCharge();
            return;
        }

        const lm = landmarks[idx];
        const shape = shapes[idx];
        const info = purplePoseInfo(shape);
        const holding = info.gun || info.pinch || info.thumbUnder;
        if (holding) {
            c.poseSeenMs = nowMs;
        } else {
            const readyGrace = (nowMs - c.thumbUnderAtMs) <= PURPLE_CAST.snapWindowMs;
            if ((nowMs - c.poseSeenMs) > (readyGrace ? PURPLE_CAST.readyGraceMs : PURPLE_CAST.poseGraceMs)) {
                cancelPurpleCharge();
                return;
            }
        }
        if (info.thumbUnder) {
            c.thumbUnderAtMs = nowMs;
            c.thumbUnderRatio = shape.thumbGapRatio;
        }

        const p = palmState(lm);
        c.x = p.cx;
        c.y = p.cy;
        c.size = p.size;
        c.lastSeenMs = nowMs;
        // Wrist roll spins the violet rings, matching the hand's rotation on the mirrored feed.
        const palmAngle = Math.atan2(lm[9].y - lm[0].y, lm[9].x - lm[0].x);
        if (purplePrevAngle !== null) {
            let dA = palmAngle - purplePrevAngle;
            if (dA > Math.PI) dA -= Math.PI * 2;
            else if (dA < -Math.PI) dA += Math.PI * 2;
            dA = Math.max(-0.8, Math.min(0.8, dA));
            purpleSpinPhase -= dA * 1.6;
        }
        purplePrevAngle = palmAngle;
        updatePurpleVisual(lm, shape, nowMs);
        // The user's real firing motion: thumb tucked under, then a quick outward swing.
        // The fingertip FLICK path cannot see this (the index tip barely moves), and tracking
        // often drops a frame mid-snap, so detect the thumbGapRatio jump over the ready window.
        const snappedOut = info.gun
            && (nowMs - c.thumbUnderAtMs) <= PURPLE_CAST.snapWindowMs
            && (shape.thumbGapRatio - c.thumbUnderRatio) >= PURPLE_CAST.snapJump;
        if (snappedOut) {
            firePurpleCharge(nowMs);
            return;
        }
        if (flicks && flicks[c.key] === nowMs && info.thumbUnder) {
            firePurpleCharge(nowMs);
            return;
        }
        if (updatePushTracker(c, p.size, nowMs)) {
            firePurpleCharge(nowMs);
        }
    }

    function computeFrameScores(results, nowMs) {
        const frameScores = Object.fromEntries(GESTURES.map((tech) => [tech, 0]));
        frameScores.neutral = 1;
        frameFlickScore = 0;
        const purpleFlicks = {};
        lastHandShapes = [];
        let redFormSeen = false;
        if (MODE === 'gojo' && purpleMode) {
            // The 茈 switch owns the interaction; Blue and Red are paused.
            if (blueCharge) cancelBlueCharge();
            frameScores.blue = 0;
            frameScores.red = 0;
        }
        // Keep an already-triggered Blue playing even if the hands leave the frame mid-animation.
        if (MODE === 'gojo' && !purpleMode && nowMs <= bluePulseUntilMs) frameScores.blue = 1;
        // Charge updates even with zero hands so losing tracking releases the blast.
        if (MODE === 'gojo' && !purpleMode && blueCharge) {
            const lms = results.multiHandLandmarks || [];
            const hk = lms.map((_, i) => results.multiHandedness?.[i]?.label ?? `hand_${i}`);
            if (updateBlueCharge(lms, hk, nowMs) === 'release') {
                releaseBlueCharge(nowMs);
            } else {
                frameScores.blue = 0;
            }
        }
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
            if (MODE === 'gojo' && purpleMode) {
                updatePurpleMode([], [], [], nowMs);
                return frameScores;
            }
            // No hands: an active Red bridges a short tracking dropout, then lets go.
            if (MODE === 'gojo' && currentTech === 'red' && (nowMs - lastRedSeenMs) < 350) {
                frameScores.red = 1;
            }
            return frameScores;
        }

        const handShapes = [];
        results.multiHandLandmarks.forEach((lm, handIdx) => {
            if (debugEnabled) {
                drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, { color: glowColor, lineWidth: 5 });
                drawLandmarks(canvasCtx, lm, { color: '#fff', lineWidth: 1, radius: 2 });
            }

            const shape = handShape(lm);
            handShapes.push(shape);
            const handScores = computeHandScores(lm, shape);

            // Red's second Gojo form (枪形): index+middle raised together, thumb flared out,
            // ring and pinky curled. Both forms anchor the field past the fingertips.
            const gunForm = MODE === 'gojo' && !purpleMode
                && shape.indexUp === 1 && shape.middleUp === 1
                && shape.ringUp === 0 && shape.pinkyUp === 0
                && shape.fingerGap < 0.065 && shape.thumbGapRatio > 0.75;
            if (!purpleMode) {
                if (gunForm) frameScores.red = 1;
                if (gunForm || handScores.red >= 1) redFormSeen = true;
                if (handScores.red >= 1 || gunForm) {
                    // Single index: its own tip; gun form: the midpoint of the two fingers.
                    const tipX = gunForm ? (lm[8].x + lm[12].x) / 2 : lm[8].x;
                    const tipY = gunForm ? (lm[8].y + lm[12].y) / 2 : lm[8].y;
                    const baseX = gunForm ? (lm[5].x + lm[9].x) / 2 : lm[5].x;
                    const baseY = gunForm ? (lm[5].y + lm[9].y) / 2 : lm[5].y;
                    const tip = handPointToWorld(tipX, tipY);
                    const base = handPointToWorld(baseX, baseY);
                    const dx = tip.x - base.x;
                    const dy = tip.y - base.y;
                    const len = Math.hypot(dx, dy);
                    if (len > 0.001) {
                        const gap = Math.min(9, Math.max(3, len * 0.9)); // finger length ≈ 7cm
                        redAnchor.x = tip.x + (dx / len) * gap;
                        redAnchor.y = tip.y + (dy / len) * gap;
                        redAnchor.valid = true;
                    }
                }

                ACTIVE_GESTURES.forEach((tech) => {
                    if (!Object.prototype.hasOwnProperty.call(handScores, tech)) return;
                    frameScores[tech] = Math.max(frameScores[tech], handScores[tech]);
                });
            }

            // Flick detection: wrist-relative motion over a short window with straightness filtering.
            const handLabel = results.multiHandedness?.[handIdx]?.label ?? `hand_${handIdx}`;
            const wrist = lm[0];
            const tip = lm[8];
            const relX = tip.x - wrist.x;
            const relY = tip.y - wrist.y;
            const indexUp = lm[8].y < lm[6].y;

            const detector = flickDetectorByHand[handLabel] || { history: [] };
            const history = detector.history;
            history.push({ x: relX, y: relY, t: nowMs });

            while (history.length > 0 && (nowMs - history[0].t) > FLICK.maxWindowMs) {
                history.shift();
            }

            let baseline = null;
            for (let i = history.length - 1; i >= 0; i--) {
                const sample = history[i];
                if ((nowMs - sample.t) >= FLICK.minLagMs) {
                    baseline = sample;
                    break;
                }
            }
            if (!baseline && history.length > 0) {
                baseline = history[0];
            }

            if (baseline) {
                const dtSec = Math.max((nowMs - baseline.t) / 1000, 1 / 120);
                const dx = relX - baseline.x;
                const dy = relY - baseline.y;
                const displacement = Math.hypot(dx, dy);
                const speed = displacement / dtSec;

                let pathLength = 0;
                for (let i = 1; i < history.length; i++) {
                    pathLength += Math.hypot(history[i].x - history[i - 1].x, history[i].y - history[i - 1].y);
                }
                const straightness = pathLength > 0.0001 ? (displacement / pathLength) : 0;

                const speedScore = clamp01((speed - FLICK.minSpeed) / (FLICK.maxSpeed - FLICK.minSpeed));
                const dispScore = clamp01((displacement - FLICK.minDisplacement) / (FLICK.maxDisplacement - FLICK.minDisplacement));
                const straightScore = clamp01((straightness - FLICK.minStraightness) / (FLICK.maxStraightness - FLICK.minStraightness));
                let handFlickScore = (0.5 * speedScore) + (0.35 * dispScore) + (0.15 * straightScore);
                if (!indexUp) handFlickScore *= 0.7;
                frameFlickScore = Math.max(frameFlickScore, handFlickScore);

                const flickTriggered = handFlickScore >= FLICK.triggerScore
                    && (nowMs - lastFlickTriggerMs) >= FLICK.refractoryMs;
                if (flickTriggered) {
                    lastFlickTriggerMs = nowMs;
                    flickPulseUntilMs = nowMs + FLICK.pulseMs;
                }
                // The 茈 firing snap is a flick made while the thumb is tucked under the two
                // raised fingers. Other flick poses must not fire the purple charge.
                if (purpleMode && flickTriggered && purplePoseInfo(shape).thumbUnder) {
                    purpleFlicks[handLabel] = nowMs;
                }
            }
            flickDetectorByHand[handLabel] = detector;
        });

        lastHandShapes = handShapes;
        const handKeys = results.multiHandLandmarks.map((_, i) => results.multiHandedness?.[i]?.label ?? `hand_${i}`);

        if (MODE === 'gojo') {
            if (purpleMode) {
                frameScores.blue = 0;
                frameScores.red = 0;
                updatePurpleMode(results.multiHandLandmarks, handShapes, handKeys, nowMs, purpleFlicks);
                return frameScores;
            }
            // Gojo pass: Blue's per-hand open>fist>open cycle arms a charge (orb follows the
            // completing hand) and the charge itself decides when to release; Red is the
            // plain index-up rule from computeHandScores(), gated off while Blue is active.
            const gojoLocked = nowMs < gestureLockUntilMs;
            const techCoolingDown = nowMs < techCooldownUntilMs;
            if (blueCharge) {
                resetBlueHandStates(); // the charge owns the interaction; keep the cycle detector idle
            } else if (gojoLocked || techCoolingDown || redFormSeen || currentTech === 'red') {
                // Fling-return swing must not arm the next technique; stages stay wiped.
                // Red forms also wipe stages: the natural open>curl>open motion of making the
                // gun sign must never satisfy Blue's open>fist>open chain.
                resetBlueHandStates();
            } else {
                const completedKey = updateBlueSequences(handShapes, handKeys, nowMs);
                if (completedKey) {
                    const ci = handKeys.indexOf(completedKey);
                    armBlueCharge(completedKey, results.multiHandLandmarks[ci >= 0 ? ci : 0], nowMs);
                }
            }
            // Blue is sequence-only in Gojo mode; the plain four-finger-spread rule is disabled.
            frameScores.blue = nowMs <= bluePulseUntilMs ? 1 : 0;
            // While Red is active, bridge short pose gaps: switching between the two forms can
            // briefly match neither rule, and a mid-switch dropout would eat the cooldown.
            if (currentTech === 'red') {
                if (frameScores.red >= 1) {
                    lastRedSeenMs = nowMs;
                } else if (nowMs - lastRedSeenMs < 350) {
                    frameScores.red = 1;
                }
            }
            // Red must not hijack an armed charge or the release lock, so the two never fight:
            // the charge owns the interaction until it releases. An ACTIVE Red is exempt
            // (otherwise its own trigger cooldown would cut the field off mid-hold).
            if (currentTech !== 'red' && (blueCharge || gojoLocked || techCoolingDown)) frameScores.red = 0;
            // The Blue charge owns the interaction; a new Void cannot start during its release
            // lock or another technique's 2s cooldown. An already-active Void is exempt so the
            // domain can be held for as long as the sign is maintained.
            if (currentTech !== 'void' && (blueCharge || gojoLocked || techCoolingDown)) frameScores.void = 0;
        } else if (results.multiHandLandmarks.length === 2) {
            const a = results.multiHandLandmarks[0];
            const b = results.multiHandLandmarks[1];
            const isUpH = (lm, tip, pip) => lm[tip].y < lm[pip].y;
            const isFist = (lm) => !isUpH(lm, 8, 6) && !isUpH(lm, 12, 10) && !isUpH(lm, 16, 14) && !isUpH(lm, 20, 18);
            const isFlat = (lm) => isUpH(lm, 8, 6) && isUpH(lm, 12, 10) && isUpH(lm, 16, 14) && isUpH(lm, 20, 18);
            const isPinch = (lm) => pinchDistance(lm) < 0.07;
            const isILY = (lm) => isUpH(lm, 8, 6) && isUpH(lm, 20, 18) && !isUpH(lm, 12, 10) && !isUpH(lm, 16, 14);
            const wristDist = Math.hypot(a[0].x - b[0].x, a[0].y - b[0].y);
            const thumbDist = Math.hypot(a[4].x - b[4].x, a[4].y - b[4].y);
            const bothIndexMiddleUp = isUpH(a, 8, 6) && isUpH(a, 12, 10) && isUpH(b, 8, 6) && isUpH(b, 12, 10);
            const tipsClose = Math.hypot(a[8].x - b[8].x, a[8].y - b[8].y) < 0.18
                && Math.hypot(a[12].x - b[12].x, a[12].y - b[12].y) < 0.22;

            let twoHandTech = null;
            if (isFist(a) && isFist(b)) twoHandTech = 'divine';
            else if ((isPinch(a) && isFlat(b)) || (isPinch(b) && isFlat(a))) twoHandTech = 'idlegamble';
            else if (thumbDist < 0.05) twoHandTech = 'transfiguration';
            else if (isILY(a) && isILY(b)) twoHandTech = 'palace';
            else if (bothIndexMiddleUp && tipsClose) frameScores.shrine = 1;
            else if (wristDist > 0.08 && wristDist < 0.15) twoHandTech = 'shadowgarden';

            if (twoHandTech) {
                ACTIVE_GESTURES.forEach((tech) => {
                    if (tech !== 'flick') frameScores[tech] *= 0.25;
                });
                frameScores[twoHandTech] = 1;
            }
        }

        frameScores.flick = nowMs <= flickPulseUntilMs ? 1 : 0;
        frameScores.neutral = clamp01(1 - maxActiveScore(frameScores));
        return frameScores;
    }

            if (tech === 'flick') {

                smoothedScores[tech] = frameScores[tech];
                return;
            }
            smoothedScores[tech] += (frameScores[tech] - smoothedScores[tech]) * TUNING.smoothingAlpha;

            };

    function triggerPurpleExplosion(nowMs) {
        if ((nowMs - lastPurpleExplosionMs) < 400) return;

        neutralLockUntilMs = purpleExplosionUntilMs + TUNING.postExplosionNeutralMs;
    }

    function maybeTriggerPurpleExitExplosion(nextGesture, nowMs) {
        const purpleArmed = nowMs <= purpleFlickEligibleUntilMs;
        const enteringFlick = nextGesture === 'flick' && currentTech !== 'flick';
        if (!purpleArmed || !enteringFlick) return;

    function resetChallenger() {
        challengerGesture = null;
        challengerSinceMs = 0;
    }

    function commitTransition(nextGesture, nowMs) {
        resetChallenger();
        // Entering any real technique starts the anti-chain cooldown (manual previews bypass this).
        if (nextGesture !== 'neutral' && nextGesture !== 'flick') {
            techCooldownUntilMs = Math.max(techCooldownUntilMs, nowMs + TECH_COOLDOWN_MS);
        }
        return nextGesture;
    }

    function pickGestureFromScores(nowMs) {
        if (currentTech === 'flick' && nowMs < flickLockUntilMs) {
            return 'flick';
        }
        if (nowMs >= purpleExplosionUntilMs && nowMs < neutralLockUntilMs) {
            return currentTech === 'neutral' ? 'neutral' : commitTransition('neutral', nowMs);
        }

        // Flick-only window after exiting Purple: ignore all other gestures.
        if (nowMs <= purpleFlickEligibleUntilMs && currentTech !== 'flick') {
            const flickReady = pendingPurpleExitFlick || nowMs <= flickPulseUntilMs || rawScores.flick >= 1;
            if (flickReady) {
                pendingPurpleExitFlick = false;
                return commitTransition('flick', nowMs);
            }
            if (nowMs >= purpleFlickEligibleUntilMs) pendingPurpleExitFlick = false;
            return currentTech === 'neutral' ? 'neutral' : commitTransition('neutral', nowMs);
        }

        let bestGesture = 'neutral';
        let bestScore = 0;

        ACTIVE_GESTURES.forEach((tech) => {
            // Outside flick-only window, normal gesture competition excludes flick.
            if (tech === 'flick') return;
            if (smoothedScores[tech] > bestScore) {
                bestScore = smoothedScores[tech];
                bestGesture = tech;
            }
        });

        const activeScore = currentTech === 'neutral' ? smoothedScores.neutral : smoothedScores[currentTech];

        if (currentTech !== 'neutral') {
            const challengerIsStronger = bestGesture !== currentTech
                && bestScore >= TUNING.enterThreshold
                && (bestScore - activeScore) >= TUNING.switchMargin;

            if (challengerIsStronger) {
                return commitTransition(bestGesture, nowMs);
            }

            const hasTimedChallenger = bestGesture !== currentTech
                && bestScore >= TUNING.enterThreshold
                && bestScore > activeScore;

            if (hasTimedChallenger) {
                if (challengerGesture !== bestGesture) {
                    challengerGesture = bestGesture;
                    challengerSinceMs = nowMs;
                } else {
                    const heldMs = nowMs - challengerSinceMs;
                    const timedOverrideReady = heldMs >= TUNING.sustainedSwitchMs
                        && (bestScore - activeScore) >= TUNING.sustainedSwitchMargin;
                    if (timedOverrideReady) {
                        return commitTransition(bestGesture, nowMs);
                    }
                }
            } else {
                resetChallenger();
            }

            if (activeScore >= TUNING.exitThreshold) {
                return currentTech;
            }

            return commitTransition('neutral', nowMs);
        }

        resetChallenger();
        if (bestScore < TUNING.enterThreshold) {
            return 'neutral';
        }

        return commitTransition(bestGesture, nowMs);
    }

    function updateState(tech, force = false) {
        if(!force && currentTech === tech) return;

        const nameEl = document.getElementById('technique-name');

        if(tech === 'shrine') { glowColor = '#ff0000'; nameEl.innerText = "領域展開「伏魔御廚子」"; baseBloomStrength = 2.5; }

        else if(tech === 'sentence') { glowColor = '#ffaa33'; nameEl.innerText = "領域展開「誅伏賜死」"; baseBloomStrength = 0.6; }
        else if(tech === 'palace') { glowColor = '#ff0000'; nameEl.innerText = "領域展開「時胞月宮殿」"; baseBloomStrength = 2.5; }
        else if(tech === 'perfection') { glowColor = '#b060ff'; nameEl.innerText = "領域展開「自閉円頓裹」"; baseBloomStrength = 2.5; }
        else if(tech === 'flick') { glowColor = '#bb88ff'; nameEl.innerText = "虚式「茈」· 放出"; baseBloomStrength = 1.4; }
        else { glowColor = purpleMode ? '#bb00ff' : '#00ffff'; nameEl.innerText = purpleMode ? "虚式「茈」" : "通常状態"; baseBloomStrength = purpleMode ? 0.35 : 1.0; }
        idleFlash.classList.toggle('active', tech === 'idlegamble');
        bloomPass.strength = baseBloomStrength;

        if (tech === 'flick') {
            // Keep current Purple-derived target shape while explosion animation runs.
            return;
        }

        for(let i=0; i<COUNT; i++) {
            let p;
            if(tech === 'neutral') {
                // Idle shows nothing at all; only an active technique emits particles.
                p = { x:0, y:0, z:0, r:0, g:0, b:0, s:0 };
            }
            else if(tech === 'red') p = getRed(i);
            else if(tech === 'void') p = getVoid(i);

            else if(tech === 'shrine') p = getShrine(i);

            else if(tech === 'transfiguration') p = getTransfiguration(i);
            else if(tech === 'ratio') p = getRatio(i);
            else if(tech === 'divine') p = getDivine(i);
            else if(tech === 'idlegamble') p = getIdleDeathGamble(i);
            else if(tech === 'love') p = getAuthenticMutualLove(i);
            else if(tech === 'sentence') p = getDeadlySentencing(i);
            else if(tech === 'palace') p = getPalace(i);
            else if(tech === 'perfection') p = getPerfection(i);

            targetPositions[i*3] = p.x; targetPositions[i*3+1] = p.y; targetPositions[i*3+2] = p.z;
            targetColors[i*3] = p.r; targetColors[i*3+1] = p.g; targetColors[i*3+2] = p.b;
            targetSizes[i] = p.s;
            if (tech === 'purple') {
                // Explosion should always originate from a Purple shape, not from whatever symbol is active later.
                purpleExplosionSourcePositions[i*3] = p.x;
                purpleExplosionSourcePositions[i*3+1] = p.y;
                purpleExplosionSourcePositions[i*3+2] = p.z;
                purpleExplosionSourceSizes[i] = p.s;
            }
        }
    }

    updateState('neutral', true);

    // ?tech=<name> pins one technique (useful for filming a take without gestures).
    const initialTech = new URLSearchParams(window.location.search).get('tech');
    if (initialTech && GESTURES.includes(initialTech)) {
        forcedTech = initialTech;
        forcedUntilMs = Infinity;
        updateState(initialTech, true);
        setGuideVisibility(false);
    }

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            await hands.send({image: videoElement});
        }, width: 640, height: 480
    });
    cameraUtils.start();

    // Animation
    function animate() {
        requestAnimationFrame(animate);
        idleTime += 0.01;
        const zoomTarget = performance.now() < zoomUntilMs ? 120 : INITIAL_CAMERA_Z;
        camera.position.z += (zoomTarget - camera.position.z) * 0.05;

        const nowMs = performance.now();
        // FPS meter for the debug panel.
        fpsFrames += 1;
        if (nowMs - fpsLastMs >= 500) {
            fpsValue = (fpsFrames * 1000) / (nowMs - fpsLastMs);
            fpsFrames = 0;
            fpsLastMs = nowMs;
        }
        // While idling or constructing, the big field is fully dark: skip its per-frame lerp and
        // 240KB attribute upload. This keeps the charge swarm smooth even on weak GPUs.
        const fieldIdle = currentTech === 'neutral'
            && nowMs > neutralSettledAtMs
            && purpleExplosionUntilMs <= nowMs;
        particles.visible = !fieldIdle;
        const pos = particles.geometry.attributes.position.array;
        const col = particles.geometry.attributes.color.array;
        const siz = particles.geometry.attributes.size.array;
        if (!fieldIdle) {
            for(let i=0; i<COUNT*3; i++) {
                pos[i] += (targetPositions[i] - pos[i]) * 0.1;
                col[i] += (targetColors[i] - col[i]) * 0.1;
            }
            for(let i=0; i<COUNT; i++) siz[i] += (targetSizes[i] - siz[i]) * 0.1;
        }
        // Charge orb: follows the anchored hand, converges to a spinning point; bursts on release.
        if (blueCharge) {
            const ageMs = Math.max(0, nowMs - blueCharge.startedMs);
            // Starts as a small ball in the palm, then billows out into a large breathing
            // state (~14–25cm across): a loose aura of particles, not a solid sphere.
            const grow = Math.min(1, ageMs / CHARGE.growMs);
            const breathe = 1 + 0.16 * Math.sin(nowMs * 0.0016) + 0.07 * Math.sin(nowMs * 0.0037 + 1.3);
            const baseRadius = (2.4 + 6.6 * grow) * breathe + Math.sin(nowMs * 0.005) * 0.22;
            const world = handPointToWorld(blueCharge.x, blueCharge.y);
            if (!chargeVisual.init) {
                chargeVisual.x = world.x;
                chargeVisual.y = world.y;
                chargeVisual.px = world.x;
                chargeVisual.py = world.y;
                chargeVisual.t = nowMs;
                chargeVisual.init = true;
            } else {
                // Damped follow: the swarm drags behind the hand and catches up when it stops.
                const dtSec = Math.min(0.1, Math.max(0.001, (nowMs - chargeVisual.t) / 1000));
                const k = 1 - Math.exp(-dtSec / (CHARGE.followTauMs / 1000));
                chargeVisual.x += (world.x - chargeVisual.x) * k;
                chargeVisual.y += (world.y - chargeVisual.y) * k;
                chargeVisual.px = chargeVisual.x;
                chargeVisual.py = chargeVisual.y;
                chargeVisual.t = nowMs;
            }
            // Remember the recent path; outer particles ride the older samples => a real trail.
            orbPathHistory.push({ x: chargeVisual.x, y: chargeVisual.y, t: nowMs });
            while (orbPathHistory.length > 1 && (nowMs - orbPathHistory[0].t) > CHARGE.pathMs) orbPathHistory.shift();
            chargeOrb.position.set(chargeVisual.x, chargeVisual.y, 0);
            chargeOrb.visible = true;
            orbMaterial.opacity = 0.95;
            fillOrbPositions(nowMs / 1000, Math.max(baseRadius, 1.1), orbPathHistory, chargeVisual.x, chargeVisual.y);
        } else {
            chargeOrb.visible = false;
            orbPathHistory.length = 0;
        }
        // 茈's charge ball / projectile. Charging: a small violet ball breathing at the
        // fingertips. Firing: a comet that accelerates from the hand to world center, then
        // hands off to the point explosion at (0,0,0).
        if (purpleMode && purpleCharge && purpleVisual.init) {
            const ageMs = Math.max(0, nowMs - purpleCharge.startedMs);
            const grow = Math.min(1, ageMs / 700);
            const breathe = 1 + 0.09 * Math.sin(nowMs * 0.006) + 0.04 * Math.sin(nowMs * 0.013 + 1.1);
            const radius = (0.5 + 0.7 * grow) * breathe;
            purplePath.push({ x: purpleVisual.x, y: purpleVisual.y, t: nowMs });
            while (purplePath.length > 1 && (nowMs - purplePath[0].t) > PURPLE_CAST.pathMs) purplePath.shift();
            purpleOrb.position.set(purpleVisual.x, purpleVisual.y, 0);
            purpleOrb.visible = true;
            purpleOrbMaterial.opacity = 0.95;
            fillPurpleOrbPositions(nowMs / 1000, radius, purplePath, purpleVisual.x, purpleVisual.y);
        } else if (purpleShot) {
            const t = clamp01((nowMs - purpleShot.startMs) / purpleShot.durationMs);
            const p = t * t; // accelerate out of the hand, arriving fast at center
            const x = purpleShot.startX * (1 - p);
            const y = purpleShot.startY * (1 - p);
            purplePath.push({ x, y, t: nowMs });
            while (purplePath.length > 1 && (nowMs - purplePath[0].t) > PURPLE_CAST.pathMs) purplePath.shift();
            purpleOrb.position.set(x, y, 0);
            purpleOrb.visible = true;
            purpleOrbMaterial.opacity = 0.95;
            fillPurpleOrbPositions(nowMs / 1000, 1.0 * (1 - 0.4 * t), purplePath, x, y);
        } else {
            purpleOrb.visible = false;
            purplePath.length = 0;
        }
        // Ambient dust: the standby particles. Idle = slow drift; Blue = they are *pulled*
        // in to orbit the blue ball and travel with the hand; Red = they are *pushed* into a
        // clean rim around the red core; Blue's release blasts them outward.
        {
            const dtSec = Math.min(0.1, Math.max(0.001, (nowMs - lastDustMs) / 1000));
            lastDustMs = nowMs;
            const tSec = nowMs / 1000;
            const attract = blueCharge ? chargeVisual : null;
            const repel = (!blueCharge && currentTech === 'red' && redFollow.init) ? redFollow : null;
            const blasting = (nowMs <= bluePulseUntilMs && !blueCharge) || nowMs <= purpleExplosionUntilMs;
            const chargeAgeSec = blueCharge ? Math.max(0, (nowMs - blueCharge.startedMs) / 1000) : 0;
            const shrink = 0.75 + 0.25 * Math.min(1, chargeAgeSec / 1.2);
            for (let i = 0; i < DUST_COUNT; i++) {
                const s = dustSeeds[i];
                let tx = s.bx + Math.sin(tSec * s.driftSpeed + s.driftPhase) * s.driftAmp;
                let ty = s.by + Math.cos(tSec * s.driftSpeed * 0.8 + s.driftPhase * 1.3) * s.driftAmp * 0.7;
                if (attract) {
                    // Spiral inward over the first ~1.2s, then ride the orb's wrist-spin.
                    const a = s.orbitPhase + tSec * s.orbitSpeed + orbSpinPhase * 0.7;
                    const rr = s.orbitR * shrink;
                    tx = attract.x + Math.cos(a) * rr;
                    ty = attract.y + Math.sin(a) * rr * 0.8;
                } else if (repel) {
                    // Anything inside the exclusion bubble is shoved out to a fuzzy rim
                    // a little beyond the visible red field.
                    const R = 30 + Math.sin(s.orbitPhase * 3.1) * 2.5;
                    const dx = dustPositions[i * 3] - repel.x;
                    const dy = dustPositions[i * 3 + 1] - repel.y;
                    const d = Math.hypot(dx, dy);
                    if (d < R) {
                        const push = R / Math.max(d, 0.001);
                        tx = repel.x + dx * push;
                        ty = repel.y + dy * push;
                    }
                }
                if (blasting) {
                    // Release: the whole ambient layer is thrown outward, then drifts back.
                    const bl = Math.hypot(s.bx, s.by) || 1;
                    tx = (s.bx / bl) * 70;
                    ty = (s.by / bl) * 70;
                }
                const k = 1 - Math.exp(-dtSec / s.tau);
                dustPositions[i * 3] += (tx - dustPositions[i * 3]) * k;
                dustPositions[i * 3 + 1] += (ty - dustPositions[i * 3 + 1]) * k;
                dustPositions[i * 3 + 2] += (s.bz - dustPositions[i * 3 + 2]) * k;
            }
            dustMaterial.opacity = blasting ? 0.9 : (attract ? 0.85 : 0.65);
            dustGeometry.attributes.position.needsUpdate = true;
        }
        const explosionTimeLeftMs = fieldIdle ? 0 : purpleExplosionUntilMs - nowMs;
        if (explosionTimeLeftMs > 0) {
            const life = explosionTimeLeftMs / TUNING.purpleExplosionDurationMs;
            const progress = 1 - life;
            const blastDistance = TUNING.purpleExplosionMaxDistance * (1 - Math.pow(1 - progress, 1.9));
            for(let i=0; i<COUNT; i++) {
                const idx = i * 3;
                let sx = purpleExplosionSourcePositions[idx];
                let sy = purpleExplosionSourcePositions[idx + 1];
                let sz = purpleExplosionSourcePositions[idx + 2];
                if (sx === 0 && sy === 0 && sz === 0) {
                    sx = targetPositions[idx];
                    sy = targetPositions[idx + 1];
                    sz = targetPositions[idx + 2];
                }
                let dx = sx;
                let dy = sy;
                let dz = sz;
                let len = Math.hypot(dx, dy, dz);
                if (len < 0.001) {
                    const a = (i / COUNT) * Math.PI * 2;
                    const b = ((i * 13) % COUNT) / COUNT * Math.PI;
                    dx = Math.cos(a) * Math.sin(b);
                    dy = Math.sin(a) * Math.sin(b);
                    dz = Math.cos(b);
                    len = Math.max(Math.hypot(dx, dy, dz), 0.001);
                }
                const variance = 0.84 + ((i % 9) * 0.035);
                const travel = blastDistance * variance;
                pos[idx] = sx + ((dx / len) * travel);
                pos[idx + 1] = sy + ((dy / len) * travel);
                pos[idx + 2] = sz + ((dz / len) * travel);
                col[idx] = PURPLE_EXPLOSION_COLOR.r;
                col[idx + 1] = PURPLE_EXPLOSION_COLOR.g;
                col[idx + 2] = PURPLE_EXPLOSION_COLOR.b;
                siz[i] = purpleExplosionSourceSizes[i] > 0 ? purpleExplosionSourceSizes[i] : siz[i];
            }
            const bloomKick = TUNING.purpleExplosionBloomBoost * life;
            bloomPass.strength = baseBloomStrength + bloomKick;
            const effectiveShake = Math.max(shakeIntensity, 0.95 * life);
            renderer.domElement.style.transform = `translate(${(Math.random()-0.5)*effectiveShake*40}px, ${(Math.random()-0.5)*effectiveShake*40}px)`;
        } else {
            bloomPass.strength = baseBloomStrength;
            if (currentTech === 'idlegamble') {
                bloomPass.strength = 3.0 + Math.sin(idleTime * 2.2) * 1.2;
            } else if (currentTech === 'love') {
                bloomPass.strength = 2.8 + Math.sin(idleTime * 1.8) * 0.5;
            }
            if (shakeIntensity > 0) {
                renderer.domElement.style.transform = `translate(${(Math.random()-0.5)*shakeIntensity*40}px, ${(Math.random()-0.5)*shakeIntensity*40}px)`;
            } else {
                renderer.domElement.style.transform = 'translate(0,0)';
            }
        }

        if (!fieldIdle) {
            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;
            particles.geometry.attributes.size.needsUpdate = true;
        }

        // Technique-specific rotation (ported from PRs #2, #3, #9, #13)
        if (fieldIdle) {
            // Nothing to rotate while the field is dark.
        } else if(currentTech === 'red') {
            particles.rotation.z -= 0.1;
        } else if (currentTech === 'blue') {
            particles.rotation.y += 0.02;
            particles.rotation.z += 0.01;
        } else if (currentTech === 'blackflash') {
            particles.rotation.x += 0.3;
            particles.rotation.y += 0.3;
        } else if (currentTech === 'purple') {
            particles.rotation.z += 0.2;
            particles.rotation.y += 0.05;
        } else if (currentTech === 'shrine') {
            particles.rotation.set(0, 0, 0);
        } else if (currentTech === 'divine') {
            particles.rotation.y += 0.005;
            particles.rotation.z += 0.005;
        } else if (currentTech === 'idlegamble') {
            particles.rotation.y -= 0.008;
            particles.rotation.z += 0.003;
        } else if (currentTech === 'love') {
            particles.rotation.y += 0.012;
        } else if (currentTech === 'sentence') {
            particles.rotation.set(0, 0, 0);
        } else if (currentTech === 'palace') {
            particles.rotation.y += 0.0005;
        } else if (currentTech === 'perfection') {
            particles.rotation.y += 0.05;
        } else {
            particles.rotation.y += 0.005;
        }

        // Red (赫): the field rides above the pointing fingertip; ease back to center once Red ends.
        if (currentTech === 'red' && redAnchor.valid) {
            if (!redFollow.init) {
                redFollow.x = redAnchor.x;
                redFollow.y = redAnchor.y;
                redFollow.init = true;
            } else {
                const dtSec = Math.min(0.1, Math.max(0.001, (nowMs - redFollow.t) / 1000));
                const k = 1 - Math.exp(-dtSec / 0.11);
                redFollow.x += (redAnchor.x - redFollow.x) * k;
                redFollow.y += (redAnchor.y - redFollow.y) * k;
            }
            redFollow.t = nowMs;
        } else if (redFollow.init) {
            const dtSec = Math.min(0.1, Math.max(0.001, (nowMs - redFollow.t) / 1000));
            const k = 1 - Math.exp(-dtSec / 0.11);
            redFollow.x -= redFollow.x * k;
            redFollow.y -= redFollow.y * k;
            redFollow.t = nowMs;
            if (Math.hypot(redFollow.x, redFollow.y) < 0.05) {
                redFollow.x = 0;
                redFollow.y = 0;
                redFollow.init = false;
            }
        }
        particles.position.set(redFollow.x, redFollow.y, 0);

        updatePurpleButton(nowMs);
        composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
